# Temporary recovery job; removed after the requested password change.
apiVersion: batch/v1
kind: Job
metadata:
  name: password-reset-bootstrap
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/component: server
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: general-1-worker-2
      containers:
        - name: recovery
          image: quay.io/keycloak/keycloak:26.8.0
          args:
            - bootstrap-admin
            - service
            - --client-id=password-reset-20261011
            - --client-secret:env=RECOVERY_CLIENT_SECRET
            - --no-prompt
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL_HOST, value: postgres-rw}
            - {name: KC_DB_URL_DATABASE, value: keycloak}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: username}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: password}
            - {name: KC_DB_TLS_MODE, value: verify-server}
            - {name: KC_DB_TLS_TRUST_STORE_FILE, value: /mnt/postgres-ca/ca.crt}
            - {name: KC_CACHE, value: local}
            - name: RECOVERY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: keycloak-bootstrap, key: password}
          volumeMounts:
            - {name: postgres-ca, mountPath: /mnt/postgres-ca, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: postgres-ca
          secret: {secretName: postgres-ca}
