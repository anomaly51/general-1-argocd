# Temporary recovery test; never used by the live Keycloak instance.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: restore-check
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202610050823-minimal-trixie@sha256:ca2c3bb893d185fe4e5d0401a010454bd87dcb67c53003c38fd828804928f5d9
  bootstrap:
    recovery:
      source: production
      recoveryTarget:
        backupID: 20261011T003228
        targetImmediate: true
  externalClusters:
    - name: production
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backups
          serverName: postgres
  storage:
    storageClass: local-path
    size: 5Gi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: general-1-worker-2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restore-check
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: restore-check}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: database-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: cloudnative-pg}
      ports:
        - {port: 8000, protocol: TCP}
