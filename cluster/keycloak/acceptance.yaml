# Temporary installation checks; removed after verification.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: postgres-acceptance
spec:
  cluster: {name: postgres}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-network-check
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: check
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202610050823-minimal-trixie@sha256:ca2c3bb893d185fe4e5d0401a010454bd87dcb67c53003c38fd828804928f5d9
          command: [/bin/bash, -ec]
          args:
            - |
              getent hosts postgres-rw keycloak-service >/dev/null
              for endpoint in postgres-rw:5432 keycloak-service:8443; do
                host=${endpoint%:*}
                port=${endpoint##*:}
                if timeout 5 bash -c "echo >/dev/tcp/$host/$port" 2>/dev/null; then
                  echo "FAIL: unauthorized access to $endpoint"
                  exit 1
                fi
                echo "PASS: unauthorized access blocked for $endpoint"
              done
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
