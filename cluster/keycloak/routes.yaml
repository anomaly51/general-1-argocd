apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  secretName: keycloak-tls
  issuerRef: {kind: ClusterIssuer, name: letsencrypt-production}
  dnsNames:
    - keycloak-general1.api-api-api.com
    - keycloak.internal.api-api-api.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: keycloak
spec:
  targetRefs:
    - {group: "", kind: Service, name: keycloak-service}
  validation:
    wellKnownCACertificates: System
    hostname: keycloak-general1.api-api-api.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-public
spec:
  parentRefs:
    - {name: public, namespace: networking, sectionName: https}
  hostnames: [keycloak-general1.api-api-api.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /realms}
        - path: {type: PathPrefix, value: /resources}
        - path: {type: PathPrefix, value: /.well-known}
      backendRefs:
        - {name: keycloak-service, port: 8443}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin
spec:
  parentRefs:
    - {name: internal, namespace: networking, sectionName: https}
  hostnames: [keycloak.internal.api-api-api.com]
  rules:
    - backendRefs:
        - {name: keycloak-service, port: 8443}
