apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-topology-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: gitops-apps
  source:
    repoURL: https://github.com/rabbitmq/messaging-topology-operator.git
    targetRevision: v1.20.1
    path: config/installation
    kustomize:
      images:
        - rabbitmqoperator/messaging-topology-operator=ghcr.io/rabbitmq/messaging-topology-operator:1.20.1
      patches:
        - target:
            kind: Namespace
            name: rabbitmq-system
          patch: |-
            $patch: delete
            apiVersion: v1
            kind: Namespace
            metadata:
              name: rabbitmq-system
        - target:
            kind: Deployment
            name: messaging-topology-operator
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: messaging-topology-operator
            spec:
              template:
                spec:
                  nodeSelector:
                    kubernetes.io/hostname: general-1-worker-2
                  containers:
                    - name: manager
                      resources:
                        requests:
                          cpu: 25m
                          memory: 32Mi
                        limits:
                          cpu: 250m
                          memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
