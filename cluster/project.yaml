apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitops-apps
  namespace: argocd
spec:
  description: Unrestricted applications for the General-1 learning cluster.
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: cutline-studio-ci
      description: Read-only rollout verification for Cutline Studio CI.
      jwtTokens:
        - id: cutline-studio-ci-20260909
          iat: 1788981825
          exp: 1820517825
      policies:
        - p, proj:gitops-apps:cutline-studio-ci, applications, get, gitops-apps/apps-cutline-studio, allow
