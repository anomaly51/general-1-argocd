apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitops-apps
  namespace: argocd
spec:
  description: Unrestricted applications for the General-1 learning cluster.
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
