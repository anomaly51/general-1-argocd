apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/anomaly51/general-1-argocd.git
        revision: main
        files:
          - path: apps/*/values/prod.yaml
          - path: apps/*/values/dev.yaml
          - path: apps/*/values/staging.yaml
          # Standalone bot chart names contain "bot". Never discover their non-prod profiles.
          - path: apps/*bot*/values/dev.yaml
            exclude: true
          - path: apps/*bot*/values/staging.yaml
            exclude: true
  template:
    metadata:
      name: '{{ if eq .path.filename "prod.yaml" }}apps-{{ index .path.segments 1 }}{{ else }}{{ index .path.segments 1 }}-{{ trimSuffix ".yaml" .path.filename }}{{ end }}'
      namespace: argocd
      labels:
        app.kubernetes.io/name: '{{ index .path.segments 1 }}'
        gitops.api-api-api.com/environment: '{{ trimSuffix ".yaml" .path.filename }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: gitops-apps
      source:
        repoURL: '{{ dig "repository" "https://github.com/anomaly51/general-1-argocd.git" ._release }}'
        targetRevision: '{{ ._release.revision }}'
        path: '{{ if not (hasKey ._release "repository") }}apps/{{ index .path.segments 1 }}{{ end }}'
        chart: '{{ if hasKey ._release "repository" }}{{ dig "chart" (index .path.segments 1) ._release }}{{ end }}'
        helm:
          releaseName: '{{ index .path.segments 1 }}'
          # Git holds the settings; the chart is pinned independently by Git SHA or OCI version.
          values: '{{ omit . "_release" "path" | toJson }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ dig "namespace" (ternary "apps" (printf "%s-%s" (index .path.segments 1) (trimSuffix ".yaml" .path.filename)) (eq .path.filename "prod.yaml")) ._release }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if or (ne .path.filename "prod.yaml") (eq (dig "policy" "promote" ._release) "prod-only") }}
    spec:
      syncPolicy:
        {{- if and (ne .path.filename "prod.yaml") (not (hasPrefix "playground-" (index .path.segments 1))) }}
        managedNamespaceMetadata:
          labels:
            gateway.api-api-api.com/public: "true"
        {{- end }}
        automated:
          prune: true
          selfHeal: true
    {{- end }}
