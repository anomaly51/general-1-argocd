apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Preserve the existing controller and production Application identities.
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/anomaly51/general-1-argocd.git
              revision: main
              files:
                - path: products/*/environments/*/deployment.yaml
          - list:
              elements: []
              elementsYaml: '{{ .components | toJson }}'
      selector:
        matchLabels:
          enabled: "true"
  template:
    metadata:
      name: '{{ .applicationName }}'
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: '{{ .product }}'
        app.kubernetes.io/component: '{{ .component }}'
        gitops.api-api-api.com/environment: '{{ .environment }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: gitops-apps
      sources:
        - repoURL: '{{ .chartRepo }}'
          targetRevision: '{{ .chartRevision }}'
          path: '{{ .chartPath }}'
          chart: '{{ .chartName }}'
          helm:
            releaseName: '{{ .releaseName }}'
            valueFiles:
              - '$values/{{ .path.path }}/{{ .component }}.yaml'
            # Release versions override environment settings.
            values: '{{ .releaseValues | toJson }}'
        - repoURL: https://github.com/anomaly51/general-1-argocd.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
