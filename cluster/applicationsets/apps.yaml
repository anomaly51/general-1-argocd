apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/anomaly51/general-1-argocd.git
        revision: main
        directories:
          - path: apps/*
        values:
          # Tested OCI chart versions own API/frontend tags; GitOps owns config.
          # Only Cutline uses this override; every other app stays Git-sourced.
          cutlineOCIEnabled: "true"
  template:
    metadata:
      name: "apps-{{ .path.basenameNormalized }}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: gitops-apps
      source:
        repoURL: https://github.com/anomaly51/general-1-argocd.git
        targetRevision: main
        path: "{{ .path.path }}"
        helm:
          releaseName: "{{ .path.basenameNormalized }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: apps
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if and (eq .path.basenameNormalized "cutline-studio") (eq .values.cutlineOCIEnabled "true") }}
    spec:
      source: null
      sources:
        - repoURL: harbor.internal.api-api-api.com/cutline-studio
          chart: cutline-studio
          targetRevision: "0.1.*"
          helm:
            releaseName: cutline-studio
            valueFiles:
              - $values/apps/cutline-studio/values.yaml
        - repoURL: https://github.com/anomaly51/general-1-argocd.git
          targetRevision: main
          ref: values
    {{- else }}
    {}
    {{- end }}
