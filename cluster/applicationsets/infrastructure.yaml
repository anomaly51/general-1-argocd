apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/anomaly51/general-1-argocd.git
        revision: main
        directories:
          - path: infrastructure/*/*
  template:
    metadata:
      name: "{{ .path.basenameNormalized }}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: gitops-apps
      source:
        repoURL: https://github.com/anomaly51/general-1-argocd.git
        targetRevision: main
        path: "{{ .path.path }}"
        helm:
          # Keep the existing NFS release name because the upstream chart uses
          # it in immutable selectors and in the StorageClass provisioner ID.
          releaseName: '{{ if eq .path.basename "nfs-provisioner" }}nfs-subdir-external-provisioner{{ else }}{{ .path.basename }}{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}'
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            secrets.hashicorp.com/vault-access: enabled
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Vault Secrets Operator ships large CRDs; use server-side apply so
          # they do not exceed the client-side last-applied annotation limit.
          - 'ServerSideApply={{ if eq .path.basename "vault-secrets-operator" }}true{{ else }}false{{ end }}'
