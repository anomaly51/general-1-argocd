# Environment settings; image versions live in deployment.yaml.
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/registry
vault:
  mount: kv
  authMount: kubernetes
  role: job-application-crm
  envPath: apps/job-application-crm
  refreshAfter: 1m
routes:
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  frontendHostname: job-crm-general1.api-api-api.com
  apiHostname: job-crm-api-general1.api-api-api.com
storage:
  className: nfs-csi
  postgresSize: 5Gi
resources:
  api:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  migration:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi
  frontend:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  postgres:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
