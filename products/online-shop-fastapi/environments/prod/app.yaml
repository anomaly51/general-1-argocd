# Environment settings; image versions live in deployment.yaml.
replicas:
  backend: 1
  frontend: 1
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/registry
vault:
  mount: kv
  authMount: kubernetes
  role: online-shop-fastapi
  envPath: apps/online-shop-fastapi
  refreshAfter: 1m
routes:
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  frontendHostname: online-shop-general1.api-api-api.com
  apiHostname: online-shop-api-general1.api-api-api.com
services:
  backend:
    port: 80
    containerPort: 8000
  frontend:
    port: 80
    containerPort: 80
storage:
  className: nfs-csi
  postgresSize: 5Gi
  uploadsSize: 5Gi
resources:
  backend:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 320Mi
  migration:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi
  frontend:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  postgres:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
