# Preserve existing production identity; promote only chart/image versions.
product: online-shop-fastapi
environment: prod
enabled: 'true'
namespace: apps
components:
- component: app
  applicationName: apps-online-shop-fastapi
  releaseName: online-shop-fastapi
  chartRepo: https://github.com/anomaly51/general-1-argocd.git
