# Environment settings; image versions live in deployment.yaml.
replicas: 1
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/registry
vault:
  mount: kv
  authMount: kubernetes
  role: shisha-guid-backend
  envPath: apps/shisha-guid-backend
  refreshAfter: 1m
route:
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  hostname: shisha-api-general1.api-api-api.com
service:
  port: 80
  containerPort: 8000
config:
  apiPublicUrl: https://shisha-api-general1.api-api-api.com
  minioEndpoint: shisha-guid-backend-minio:9000
  minioBucket: shisha-guid
  maxUploadBytes: '5242880'
storage:
  className: nfs-csi
  postgresSize: 5Gi
  minioSize: 10Gi
resources:
  api:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 320Mi
  postgres:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  minio:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  wait:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 25m
      memory: 32Mi
