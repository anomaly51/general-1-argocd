# Preserve existing production identity; promote only chart/image versions.
product: uptime-monitor
environment: prod
enabled: 'true'
namespace: apps
components:
- component: app
  applicationName: apps-uptime-monitor
  releaseName: uptime-monitor
  chartRepo: https://github.com/anomaly51/general-1-argocd.git
  chartRevision: ccd32793828376539a29048135f6069da9994d6e
  chartPath: apps/uptime-monitor
  chartName: ''
  releaseValues:
    images:
      api:
        repository: harbor.internal.api-api-api.com/applications/uptime-monitor-api
        tag: sha-ea2c079c282a
        pullPolicy: IfNotPresent
      frontend:
        repository: harbor.internal.api-api-api.com/applications/uptime-monitor-frontend
        tag: sha-ea2c079c282a
        pullPolicy: IfNotPresent
      postgres:
        repository: docker.io/library/postgres
        tag: 16-alpine
        pullPolicy: IfNotPresent
  environmentValues:
    registry:
      server: harbor.internal.api-api-api.com
      vaultPath: apps/registry
    vault:
      mount: kv
      authMount: kubernetes
      role: uptime-monitor
      envPath: apps/uptime-monitor
      refreshAfter: 1m
    routes:
      gatewayName: public
      gatewayNamespace: networking
      gatewaySectionName: https
      frontendHostname: uptime-general1.api-api-api.com
      apiHostname: uptime-api-general1.api-api-api.com
    storage:
      className: nfs-csi
      postgresSize: 5Gi
      legacyRabbitmqSize: 2Gi
    resources:
      api:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 250m
          memory: 256Mi
      worker:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 250m
          memory: 256Mi
      scheduler:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 192Mi
      bot:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 192Mi
      frontend:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      postgres:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 384Mi
