# Environment settings; image versions live in deployment.yaml.
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/registry
vault:
  mount: kv
  authMount: kubernetes
  role: uptime-monitor
  envPath: apps/uptime-monitor
  refreshAfter: 1m
routes:
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  frontendHostname: uptime-general1.api-api-api.com
  apiHostname: uptime-api-general1.api-api-api.com
storage:
  className: nfs-csi
  postgresSize: 5Gi
  legacyRabbitmqSize: 2Gi
resources:
  api:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  worker:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  scheduler:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi
  bot:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi
  frontend:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  postgres:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
