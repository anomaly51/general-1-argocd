# Environment settings; image versions live in deployment.yaml.
replicas: 1
resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 256Mi
postgresql:
  image:
    repository: postgres
    tag: 16.4-bookworm
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    storageClassName: nfs-csi
    size: 2Gi
