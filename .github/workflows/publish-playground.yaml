name: Publish playground image to GitOps

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: playground-gitops-${{ inputs.service }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment: ${{ github.ref_name == 'main' && 'staging' || 'dev' }}
    runs-on: arc-runner-set
    timeout-minutes: 30
    steps:
      - name: Validate caller before requesting credentials
        env:
          SERVICE: ${{ inputs.service }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SERVICE" in
            order-service|pricing-service|inventory-service|event-hub|analytics-service|shell|topology-mfe|traffic-mfe) ;;
            *) echo 'Unknown service'; exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = "anomaly51/playground-$SERVICE"
      - name: Read scoped publishing credentials
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.internal.api-api-api.com
          method: jwt
          path: github
          role: ci-playground-${{ inputs.service }}-publish
          jwtGithubAudience: playground-ci
          exportEnv: false
          secrets: |
            kv/data/ci/github-app app_id | APP_ID ;
            kv/data/ci/github-app private_key | APP_PRIVATE_KEY ;
            kv/data/ci/argocd-status token | ARGOCD_AUTH_TOKEN ;
            kv/data/apps/playground-prod/registry username | REGISTRY_USERNAME ;
            kv/data/apps/playground-prod/registry password | REGISTRY_PASSWORD
      - name: Issue a short-lived token for only the GitOps repository
        id: gitops-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ steps.vault.outputs.APP_ID }}
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: anomaly51
          repositories: general-1-argocd
          permission-contents: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anomaly51/general-1-argocd
          ref: main
          fetch-depth: 0
          token: ${{ steps.gitops-token.outputs.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Download the successful publish job's artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image
      - name: Verify provenance and commit the exact image digest
        id: release
        env:
          SERVICE: ${{ inputs.service }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ steps.vault.outputs.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ steps.vault.outputs.REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/scripts/publish_playground.py --service "$SERVICE" \
            --artifact "$RUNNER_TEMP/release-image/release-image.json"
      - name: Wait for Argo CD to deploy this exact release
        if: steps.release.outputs.commit != '' && steps.release.outputs.active == 'true'
        env:
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'staging' || 'dev' }}
          ARGOCD_SERVER: https://argocd.internal.api-api-api.com
          ARGOCD_AUTH_TOKEN: ${{ steps.vault.outputs.ARGOCD_AUTH_TOKEN }}
        run: python .github/scripts/argocd_release.py wait --app "playground-$SERVICE" --environment "$ENVIRONMENT"
