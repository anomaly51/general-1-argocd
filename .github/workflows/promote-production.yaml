name: Promote production

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application directory (for example shisha-guid-backend)
        required: true
        type: string
      staging_commit:
        description: Full GitOps SHA of the healthy staging release (normally required)
        type: string
      source_commit:
        description: Only for apps WITHOUT staging - full source main SHA built by CI
        type: string
      chart_version:
        description: Only for prod-only OCI charts - exact chart version from CI
        type: string
      release_verified:
        description: I have tested the selected release and approve production deployment
        required: true
        default: false
        type: boolean
      dry_run:
        description: Show the proposed change without committing or deploying
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-set
    timeout-minutes: 35
    environment: production
    steps:
      - name: Require explicit release verification
        if: inputs.dry_run == false
        env:
          VERIFIED: ${{ inputs.release_verified }}
        run: test "$VERIFIED" = true
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Authenticate the production workflow to Vault
        id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.internal.api-api-api.com
          method: jwt
          path: github
          role: gitops-production
          jwtGithubAudience: gitops-ci
          exportEnv: false
          secrets: |
            kv/data/ci/argocd-production token | ARGOCD_AUTH_TOKEN ;
            kv/data/ci/harbor-applications username | HARBOR_USERNAME ;
            kv/data/ci/harbor-applications password | HARBOR_PASSWORD ;
            kv/data/apps/cutline-studio/harbor-ci username | CUTLINE_USERNAME ;
            kv/data/apps/cutline-studio/harbor-ci password | CUTLINE_PASSWORD ;
      - name: Validate and prepare the exact release
        env:
          APPLICATION: ${{ inputs.application }}
          STAGING_COMMIT: ${{ inputs.staging_commit }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CHART_VERSION: ${{ inputs.chart_version }}
          ARGOCD_SERVER: https://argocd.internal.api-api-api.com
          ARGOCD_AUTH_TOKEN: ${{ steps.vault.outputs.ARGOCD_AUTH_TOKEN }}
          REGISTRY_USERNAME: ${{ inputs.application == 'cutline-studio' && steps.vault.outputs.CUTLINE_USERNAME || steps.vault.outputs.HARBOR_USERNAME }}
          REGISTRY_PASSWORD: ${{ inputs.application == 'cutline-studio' && steps.vault.outputs.CUTLINE_PASSWORD || steps.vault.outputs.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login harbor.internal.api-api-api.com --username "$REGISTRY_USERNAME" --password-stdin
          python .github/scripts/promote_release.py --app "$APPLICATION" \
            --commit "$STAGING_COMMIT" --source-commit "$SOURCE_COMMIT" --chart-version "$CHART_VERSION"
          git diff --check
          {
            echo '### Proposed production release'
            echo '```diff'
            git diff -- "apps/$APPLICATION/values/prod.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the selected production profile
        if: inputs.dry_run == false
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "apps/$APPLICATION/values/prod.yaml"
          if ! git diff --cached --quiet; then
            git commit -m "deploy($APPLICATION): promote verified release"
            # Concurrent pushes fail safely. Rerun the workflow; never force push.
            git push origin HEAD:main
          fi
      - name: Synchronize production and verify rollout
        if: inputs.dry_run == false
        env:
          APPLICATION: ${{ inputs.application }}
          ARGOCD_SERVER: https://argocd.internal.api-api-api.com
          ARGOCD_AUTH_TOKEN: ${{ steps.vault.outputs.ARGOCD_AUTH_TOKEN }}
        run: python .github/scripts/argocd_release.py sync --app "$APPLICATION" --environment prod
