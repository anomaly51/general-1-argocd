name: Promote production

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product directory, e.g. shisha-guide
        required: true
        type: string
      staging_commit:
        description: Full GitOps commit SHA of the staging release you tested
        required: true
        type: string
      staging_verified:
        description: I verified this exact release on staging (Synced/Healthy and smoke tests)
        required: true
        default: false
        type: boolean
      dry_run:
        description: Show the proposed production change without committing it
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    # Run trusted workflow code from main, never from a selectable feature branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/environments.py validate
      - run: python -m unittest discover -s tests -v
      - name: Prepare production release
        env:
          PRODUCT: ${{ inputs.product }}
          STAGING_COMMIT: ${{ inputs.staging_commit }}
          VERIFIED: ${{ inputs.staging_verified }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERIFIED" != "true" ]]; then
            echo "Verify the selected release on staging before promoting."
            exit 1
          fi
          # No shell interpolation of workflow inputs; the script validates identifiers.
          python scripts/environments.py promote --product "$PRODUCT" --staging-commit "$STAGING_COMMIT"
          python scripts/environments.py validate
          git diff --check
          git diff -- "products/$PRODUCT/environments/prod/deployment.yaml"
          {
            echo '### Proposed production release'
            echo '```diff'
            git diff -- "products/$PRODUCT/environments/prod/deployment.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo 'Dry run: no commit or deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "products/$PRODUCT/environments/prod/deployment.yaml"
          if git diff --cached --quiet; then
            echo 'Production already references this release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "deploy($PRODUCT): promote tested staging release"
          # A concurrent push fails safely. Rerun against fresh main; never force-push/rebase a promotion.
          git push origin HEAD:main
          echo 'Committed desired production release. Argo CD will reconcile it; check rollout health in Argo CD.' >> "$GITHUB_STEP_SUMMARY"
