name: Promote playground to prod

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      staging_commit:
        description: Optional full GitOps SHA of the currently healthy staging release
        default: ''
        type: string
      confirm:
        description: Explicit approval to deploy the verified staging image to production
        required: true
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: playground-production-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm
    environment: prod
    runs-on: arc-runner-set
    timeout-minutes: 30
    steps:
      - name: Validate caller before requesting credentials
        env:
          SERVICE: ${{ inputs.service }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SERVICE" in
            order-service|pricing-service|inventory-service|event-hub|analytics-service|shell|topology-mfe|traffic-mfe) ;;
            *) echo 'Unknown service'; exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = "anomaly51/playground-$SERVICE"
      - name: Read scoped promotion credentials from Vault
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.internal.api-api-api.com
          method: jwt
          path: github
          role: ci-playground-${{ inputs.service }}-promote
          jwtGithubAudience: playground-ci
          exportEnv: false
          secrets: |
            kv/data/ci/github-app app_id | APP_ID ;
            kv/data/ci/github-app private_key | APP_PRIVATE_KEY ;
            kv/data/ci/argocd-production token | ARGOCD_AUTH_TOKEN ;
            kv/data/apps/playground-prod/registry username | REGISTRY_USERNAME ;
            kv/data/apps/playground-prod/registry password | REGISTRY_PASSWORD
      - name: Issue a short-lived token limited to the GitOps repository
        id: gitops-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ steps.vault.outputs.APP_ID }}
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: anomaly51
          repositories: general-1-argocd
          permission-contents: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anomaly51/general-1-argocd
          ref: main
          fetch-depth: 0
          token: ${{ steps.gitops-token.outputs.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.18.6
      - name: Verify the exact running staging release and prepare production
        env:
          SERVICE: ${{ inputs.service }}
          STAGING_COMMIT: ${{ inputs.staging_commit }}
          GH_TOKEN: ${{ github.token }}
          ARGOCD_SERVER: https://argocd.internal.api-api-api.com
          ARGOCD_AUTH_TOKEN: ${{ steps.vault.outputs.ARGOCD_AUTH_TOKEN }}
          REGISTRY_USERNAME: ${{ steps.vault.outputs.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ steps.vault.outputs.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          python .github/scripts/promote_playground.py --service "$SERVICE" --staging-commit "$STAGING_COMMIT"
          git diff --check
          {
            echo '### Verified staging → production (no rebuild)'
            echo '```diff'
            git diff -- "apps/playground-$SERVICE/values/prod.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only this production image and release metadata
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "apps/playground-$SERVICE/values/prod.yaml"
          if ! git diff --cached --quiet; then
            git commit -m "deploy(playground-$SERVICE): promote staging"
            # Fail safely on concurrent updates; never force-push or select a newer release.
            git push origin HEAD:main
          fi
      - name: Deploy the GitOps commit through Argo CD and verify production
        env:
          SERVICE: ${{ inputs.service }}
          ARGOCD_SERVER: https://argocd.internal.api-api-api.com
          ARGOCD_AUTH_TOKEN: ${{ steps.vault.outputs.ARGOCD_AUTH_TOKEN }}
        run: python .github/scripts/argocd_release.py sync --app "playground-$SERVICE" --environment prod
