name: Sync tested Cutline Studio release

on:
  schedule:
    # Offset from the busiest five-minute/hour boundaries; still every five minutes.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cutline-studio-gitops-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: arc-runner-set
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The ephemeral token can write only THIS GitOps repository.
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test marker validation and tag-update guards
        run: python scripts/cutline-studio-sync.test.py
      - name: Consume tested main release and update only two tags
        env:
          HARBOR_USERNAME: ${{ secrets.CUTLINE_HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.CUTLINE_HARBOR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cutline-studio-deploy[bot]'
          git config user.email 'cutline-studio-deploy@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git switch --detach FETCH_HEAD
            python scripts/cutline-studio-sync.py sync
            if git diff --quiet -- apps/cutline-studio/values.yaml; then
              exit 0
            fi
            git add -- apps/cutline-studio/values.yaml
            git commit -m 'deploy cutline-studio tested release'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "GitOps branch advanced; retry ${attempt}/5"
            sleep "$attempt"
          done
          echo 'GitOps push failed after five attempts'
          exit 1
