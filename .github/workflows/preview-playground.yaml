name: Preview environments

on:
  repository_dispatch:
    types: [playground-preview]
  workflow_dispatch:
    inputs:
      operation:
        description: Refresh renews the 15-minute lease or recreates an expired preview
        type: choice
        options: [refresh, reconcile]
        default: refresh
        required: true
      branch:
        description: Exact feature branch shared across the application repositories
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-set
    timeout-minutes: 45
    concurrency:
      group: playground-preview-orchestration
      queue: max
    outputs:
      deployed: ${{ steps.compose.outputs.deployed }}
      namespace: ${{ steps.compose.outputs.namespace }}
      generation: ${{ steps.compose.outputs.generation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Read trusted orchestration identity
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b
        with:
          url: https://vault.internal.api-api-api.com
          method: jwt
          path: github
          role: ci-playground-preview
          jwtGithubAudience: playground-preview
          exportEnv: false
          secrets: |
            kv/data/ci/github-app app_id | APP_ID ;
            kv/data/ci/github-app private_key | APP_PRIVATE_KEY
      - name: Scope writes to the GitOps repository
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ steps.vault.outputs.APP_ID }}
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: anomaly51
          repositories: general-1-argocd
          permission-contents: write
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver: remote
          endpoint: tcp://arc-buildkit.arc-runners.svc.cluster.local:1234
      - name: Compose and publish the complete preview
        id: compose
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PREVIEW_BRANCH: ${{ inputs.branch }}
          PREVIEW_OPERATION: ${{ inputs.operation || 'reconcile' }}
        run: python .github/scripts/playground_preview.py --operation "$PREVIEW_OPERATION" --branch "$PREVIEW_BRANCH"

  ready:
    needs: preview
    if: needs.preview.outputs.deployed == 'true'
    # Waiting only reads GitHub state; don't occupy scarce cluster capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Verify readiness without holding a cluster runner
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_NAMESPACE: ${{ needs.preview.outputs.namespace }}
          PREVIEW_GENERATION: ${{ needs.preview.outputs.generation }}
        run: python .github/scripts/playground_preview.py --wait-namespace "$PREVIEW_NAMESPACE" --generation "$PREVIEW_GENERATION"
