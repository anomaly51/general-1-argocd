apiVersion: v1
kind: Service
metadata:
  name: find-offer-fast-api
spec:
  selector:
    app.kubernetes.io/name: find-offer-fast-api
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: find-offer-fast
spec:
  parentRefs:
    - {name: public, namespace: networking, sectionName: https}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: find-offer-fast-api, port: 8000}
