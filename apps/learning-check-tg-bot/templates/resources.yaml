apiVersion: v1
kind: ServiceAccount
metadata:
  name: learning-check-tg-bot
  labels:
    app.kubernetes.io/name: learning-check-tg-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: learning-check-tg-bot
  labels:
    app.kubernetes.io/name: learning-check-tg-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: learning-check-tg-bot
    serviceAccount: learning-check-tg-bot
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: learning-check-tg-bot-env
  labels:
    app.kubernetes.io/name: learning-check-tg-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: learning-check-tg-bot
  mount: kv
  type: kv-v2
  path: apps/learning-check-tg-bot
  refreshAfter: 1m
  destination:
    create: true
    name: learning-check-tg-bot-env
    transformation:
      includes:
        - ^(BOT_TOKEN|GROUP_CHAT_ID|ADMIN_ID)$
  rolloutRestartTargets:
    - kind: Deployment
      name: learning-check-tg-bot
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: learning-check-tg-bot-service-key
  labels:
    app.kubernetes.io/name: learning-check-tg-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: learning-check-tg-bot
  mount: kv
  type: kv-v2
  path: apps/learning-check-tg-bot
  refreshAfter: 1m
  destination:
    create: true
    name: learning-check-tg-bot-service-key
    transformation:
      includes:
        - '^service_key[.]json$'
  rolloutRestartTargets:
    - kind: Deployment
      name: learning-check-tg-bot
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: learning-check-tg-bot-registry
  labels:
    app.kubernetes.io/name: learning-check-tg-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: learning-check-tg-bot
  mount: kv
  type: kv-v2
  path: apps/registry
  refreshAfter: 1h
  destination:
    create: true
    name: learning-check-tg-bot-registry
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludes:
        - .*
      templates:
        .dockerconfigjson:
          text: |
            {"auths":{"harbor.internal.api-api-api.com":{"username":"{{ `{{ get .Secrets "username" }}` }}","password":"{{ `{{ get .Secrets "password" }}` }}"}}}
  rolloutRestartTargets:
    - kind: Deployment
      name: learning-check-tg-bot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-check-tg-bot
  labels:
    app.kubernetes.io/name: learning-check-tg-bot
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: learning-check-tg-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learning-check-tg-bot
    spec:
      serviceAccountName: learning-check-tg-bot
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: learning-check-tg-bot-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - secretRef:
                name: learning-check-tg-bot-env
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: service-key
              mountPath: /app/service_key.json
              subPath: service_key.json
              readOnly: true
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: service-key
          secret:
            secretName: learning-check-tg-bot-service-key
            defaultMode: 0440
            items:
              - key: service_key.json
                path: service_key.json
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
