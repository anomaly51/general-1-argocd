apiVersion: apps/v1
kind: Deployment
metadata:
  name: shisha-guid-frontend
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shisha-guid-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shisha-guid-frontend
    spec:
      serviceAccountName: shisha-guid-frontend
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: shisha-guid-frontend-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PUBLIC_SITE_URL
              value: {{ .Values.config.publicSiteUrl | quote }}
            - name: SSR_API_URL
              value: {{ .Values.config.ssrApiUrl | quote }}
            - name: VITE_SSR_API_URL
              value: {{ .Values.config.ssrApiUrl | quote }}
          envFrom:
            - secretRef:
                name: shisha-guid-frontend-env
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: shisha-guid-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shisha-guid-frontend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shisha-guid-frontend
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
      sectionName: {{ .Values.route.gatewaySectionName }}
  hostnames:
    - {{ .Values.route.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: shisha-guid-frontend
          port: {{ .Values.service.port }}
