  tag: staging@sha256:9c90aa730916133f7b2ed291177102917d7e570fabff53c5e7029eee5a2b3fea
  pullPolicy: IfNotPresent
serviceAccountName: playground-runtime
imagePullSecret: playground-registry
envSecret: ''
probes:
  livenessPath: /healthz
  readinessPath: /healthz
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
    add:
    - CHOWN
    - NET_BIND_SERVICE
    - SETGID
    - SETUID
resources:
  requests:
    cpu: 10m
    memory: 32Mi
    ephemeral-storage: 16Mi
  limits:
    cpu: 100m
    memory: 96Mi
    ephemeral-storage: 192Mi
scratchVolumes:
- name: tmp
  mountPath: /tmp
  sizeLimit: 32Mi
- name: nginx-cache
  mountPath: /var/cache/nginx
  sizeLimit: 64Mi
- name: nginx-run
  mountPath: /var/run
  sizeLimit: 16Mi
env: {}
