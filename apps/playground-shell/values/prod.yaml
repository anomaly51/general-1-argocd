# Complete prod-only configuration; there is no shared values.yaml.
_release:
  revision: e87769933b7bec6ad26803d5bdc39cca40148127
  policy: prod-only
  namespace: playground-prod
  sourceRepository: anomaly51/playground-shell

replicaCount: 1
component: frontend
appService:
  name: shell
  port: 80
image:
  repository: harbor.internal.api-api-api.com/playground/shell
  tag: prod@sha256:01017d5f524c97131488f8379077904ecfdde96f881fa5860224d05f19498eba
  pullPolicy: IfNotPresent
serviceAccountName: playground-runtime
imagePullSecret: playground-registry
envSecret: ""
probes:
  livenessPath: /healthz
  readinessPath: /healthz
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
resources:
  requests:
    cpu: 10m
    memory: 32Mi
    ephemeral-storage: 16Mi
  limits:
    cpu: 100m
    memory: 96Mi
    ephemeral-storage: 192Mi
scratchVolumes:
  - name: tmp
    mountPath: /tmp
    sizeLimit: 32Mi
  - name: nginx-cache
    mountPath: /var/cache/nginx
    sizeLimit: 64Mi
  - name: nginx-run
    mountPath: /var/run
    sizeLimit: 16Mi
# URLs are compiled into these same-origin static assets; no runtime VITE_* override.
env: {}
