          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
          argocd.argoproj.io/sync-wave: "-3"
      spec:
        backoffLimit: 2
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              app.kubernetes.io/name: anomaly51-user-migrate
              app.kubernetes.io/component: migration
              app.kubernetes.io/part-of: anomaly51
          spec:
            restartPolicy: Never
            serviceAccountName: anomaly51-prod
            automountServiceAccountToken: false
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            imagePullSecrets:
              - name: anomaly51-registry
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: migrate
                image: __IMAGE_user__
                imagePullPolicy: IfNotPresent
                command:
                  - sh
                  - -ec
                args:
                  - |
                    until node -e 'const u=new URL(process.env.DATABASE_URL);const s=require("node:net").createConnection({host:u.hostname,port:Number(u.port||5432)});s.setTimeout(2000);s.once("connect",()=>{s.end();process.exit(0)});const fail=()=>process.exit(1);s.once("error",fail);s.once("timeout",fail)'; do sleep 2; done
