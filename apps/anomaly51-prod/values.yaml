      kind: Job
      metadata:
        name: anomaly51-user-migrate
        labels:
          app.kubernetes.io/name: anomaly51-user-migrate
          app.kubernetes.io/component: migration
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
          argocd.argoproj.io/sync-wave: "-3"
      spec:
        backoffLimit: 2
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              app.kubernetes.io/name: anomaly51-user-migrate
              app.kubernetes.io/component: migration
              app.kubernetes.io/part-of: anomaly51
          spec:
            restartPolicy: Never
            serviceAccountName: anomaly51-prod
            automountServiceAccountToken: false
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            imagePullSecrets:
              - name: anomaly51-registry
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: migrate
                image: __IMAGE_user__
                imagePullPolicy: IfNotPresent
                command:
                  - sh
                  - -ec
                args:
                  - |
                    until node -e 'const u=new URL(process.env.DATABASE_URL);const s=require("node:net").createConnection({host:u.hostname,port:Number(u.port||5432)});s.setTimeout(2000);s.once("connect",()=>{s.end();process.exit(0)});const fail=()=>process.exit(1);s.once("error",fail);s.once("timeout",fail)'; do sleep 2; done
                    exec node apps/user-service/dist/src/migrate.js
                env:
                  - name: NODE_ENV
                    value: production
                  - name: ALLOWED_ORIGINS
                    value: https://anomaly51.api-api-api.com,https://anomaly51-api.api-api-api.com
                  - name: REDIS_URL
                    value: redis://anomaly51-redis-managed:6379
                  - name: ENABLE_DEV_AUTH
                    value: "false"
                envFrom:
                  - secretRef:
                      name: anomaly51-env
                resources:
                  requests:
                    cpu: 10m
                    # One-shot hook; keep the limit realistic while allowing it to
                    # schedule on the request-saturated development cluster.
                    memory: 16Mi
                  limits:
                    cpu: 150m
                    memory: 192Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: tmp
                emptyDir: {}
