# CI changes only app.images.<service>.tag. Keep deployed tags immutable.
app:
  name: anomaly51
  resourceName: anomaly51
  images:
    web:
      repository: harbor.internal.api-api-api.com/applications/anomaly51-web
      tag: sha-cb09bd69e8fd
    user:
      repository: harbor.internal.api-api-api.com/applications/anomaly51-user-service
      tag: sha-cb09bd69e8fd
    casino:
      repository: harbor.internal.api-api-api.com/applications/anomaly51-casino-service
      tag: sha-cb09bd69e8fd
    telegram:
      repository: harbor.internal.api-api-api.com/applications/anomaly51-telegram-service
      tag: sha-cb09bd69e8fd
  # The reusable chart deliberately treats these as structured Kubernetes
  # resources. No workload-specific Helm templates live in this wrapper.
  objects:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: anomaly51-prod
        labels:
          app.kubernetes.io/name: anomaly51
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-10"
      automountServiceAccountToken: false
    - apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultAuth
      metadata:
        name: anomaly51-prod
        labels:
          app.kubernetes.io/name: anomaly51
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-9"
      spec:
        method: kubernetes
        mount: kubernetes
        kubernetes:
          role: anomaly51-prod
          serviceAccount: anomaly51-prod
          audiences:
            - vault
          tokenExpirationSeconds: 600
    # Vault kv/apps/anomaly51/prod owns DATABASE_URL, JWT_SECRET,
    # INTERNAL_SERVICE_TOKEN, ROUND_SEED_ENCRYPTION_KEY, TELEGRAM_BOT_TOKEN,
    # TELEGRAM_WEBHOOK_SECRET, POSTGRES_USER, POSTGRES_PASSWORD,
    # RABBITMQ_USERNAME, RABBITMQ_PASSWORD and RABBITMQ_URL. DATABASE_URL must address
    # anomaly51-postgres-rw:5432; RABBITMQ_URL must use vhost anomaly51.
    - apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: anomaly51-runtime
        labels:
          app.kubernetes.io/name: anomaly51
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-8"
      spec:
        vaultAuthRef: anomaly51-prod
        mount: kv
        type: kv-v2
        path: apps/anomaly51/prod
        refreshAfter: 1m
        destination:
          create: true
          name: anomaly51-env
        rolloutRestartTargets:
          - kind: Deployment
            name: anomaly51-user-service
          - kind: Deployment
            name: anomaly51-casino-service
          - kind: Deployment
            name: anomaly51-telegram-service
    # The same Vault entry is projected to the key names CloudNativePG expects.
    - apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: anomaly51-postgres-bootstrap
        labels:
          app.kubernetes.io/name: anomaly51-postgres
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-8"
      spec:
        vaultAuthRef: anomaly51-prod
        mount: kv
        type: kv-v2
        path: apps/anomaly51/prod
        refreshAfter: 1m
        destination:
          create: true
          name: anomaly51-postgres-bootstrap
          type: kubernetes.io/basic-auth
          transformation:
            excludes:
              - ".*"
            templates:
              username:
                text: '{{ get .Secrets "POSTGRES_USER" }}'
              password:
                text: '{{ get .Secrets "POSTGRES_PASSWORD" }}'
    # RabbitMQ's topology operator imports `username` and `password` from this
    # Vault-backed Secret. The runtime AMQP URL remains in anomaly51-env.
    - apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: anomaly51-rabbitmq
        labels:
          app.kubernetes.io/name: anomaly51-rabbitmq
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-8"
      spec:
        vaultAuthRef: anomaly51-prod
        mount: kv
        type: kv-v2
        path: apps/anomaly51/prod
        refreshAfter: 1m
        destination:
          create: true
          name: anomaly51-rabbitmq
          labels:
            rabbitmq.com/topology-operator: "true"
          transformation:
            excludes:
              - ".*"
            templates:
              username:
                text: '{{ get .Secrets "RABBITMQ_USERNAME" }}'
              password:
                text: '{{ get .Secrets "RABBITMQ_PASSWORD" }}'
    - apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: anomaly51-registry
        labels:
          app.kubernetes.io/name: anomaly51
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-8"
      spec:
        vaultAuthRef: anomaly51-prod
        mount: kv
        type: kv-v2
        path: apps/registry
        refreshAfter: 1h
        destination:
          create: true
          name: anomaly51-registry
          type: kubernetes.io/dockerconfigjson
          transformation:
            excludes:
              - ".*"
            templates:
              .dockerconfigjson:
                text: |
                  {"auths":{"harbor.internal.api-api-api.com":{"username":"{{ get .Secrets "username" }}","password":"{{ get .Secrets "password" }}"}}}
        rolloutRestartTargets:
          - kind: Deployment
            name: anomaly51-web
          - kind: Deployment
            name: anomaly51-user-service
          - kind: Deployment
            name: anomaly51-casino-service
          - kind: Deployment
            name: anomaly51-telegram-service
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: anomaly51-postgres
        labels:
          app.kubernetes.io/name: anomaly51-postgres
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-7"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      spec:
        instances: 1
        imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
        bootstrap:
          initdb:
            database: anomaly51
            owner: anomaly51
            encoding: UTF8
            secret:
              name: anomaly51-postgres-bootstrap
        storage:
          storageClass: nfs-csi
          size: 5Gi
        postgresql:
          parameters:
            max_connections: "50"
            shared_buffers: 32MB
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 384Mi
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - general-1-worker-2
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: anomaly51-redis-config
        labels:
          app.kubernetes.io/name: anomaly51-redis
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-7"
      data:
        redis-additional.conf: |
          appendonly yes
          appendfsync everysec
          maxmemory-policy noeviction
    # The operator owns the StatefulSet and Services. A distinct CR name avoids
    # fighting the retired Git-owned StatefulSet while reusing its retained PVC.
    - apiVersion: redis.redis.opstreelabs.in/v1beta2
      kind: Redis
      metadata:
        name: anomaly51-redis-managed
        labels:
          app.kubernetes.io/name: anomaly51-redis
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-6"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      spec:
        kubernetesConfig:
          image: quay.io/opstree/redis:v7.4.11@sha256:115d8e221b1459b9f2db7d927ed40318ffac4eb2cddb5702974bce92d32b7a51
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              # The cluster is request-saturated; runtime remains protected by the 128Mi limit.
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
          service:
            serviceType: ClusterIP
            additional:
              enabled: false
        redisConfig:
          additionalRedisConfig: anomaly51-redis-config
          maxMemoryPercentOfLimit: 75
        storage:
          # This PVC is external to the CR and remains available if the CR is removed.
          keepAfterDelete: true
          volumeMount:
            volume:
              - name: redis-data
                persistentVolumeClaim:
                  claimName: data-anomaly51-redis-0
            mountPath:
              - name: redis-data
                mountPath: /data
        # Required by redis-operator when persistence uses an external PVC.
        env:
          - name: PERSISTENCE_ENABLED
            value: "true"
        serviceAccountName: anomaly51-prod
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        terminationGracePeriodSeconds: 30
    # The frontend hostname keeps API and Socket.IO calls same-origin. The
    # catch-all web rule is last and therefore never receives backend paths.
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: anomaly51
        labels:
          app.kubernetes.io/name: anomaly51
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "1"
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: public
            namespace: networking
            sectionName: https
        hostnames:
          - anomaly51.api-api-api.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/auth
            backendRefs:
              - group: ""
                kind: Service
                name: anomaly51-user-service
                port: 80
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/telegram
            backendRefs:
              - group: ""
                kind: Service
                name: anomaly51-telegram-service
                port: 80
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/wallet
              - path:
                  type: PathPrefix
                  value: /api/game
              - path:
                  type: PathPrefix
                  value: /api/crash
              - path:
                  type: PathPrefix
                  value: /api/slots
              - path:
                  type: PathPrefix
                  value: /api/plinko
              - path:
                  type: PathPrefix
                  value: /api/pig-bank
              - path:
                  type: PathPrefix
                  value: /api/truffle-raid
              - path:
                  type: PathPrefix
                  value: /api/health
              - path:
                  type: PathPrefix
                  value: /socket.io
            backendRefs:
              - group: ""
                kind: Service
                name: anomaly51-casino-service
                port: 80
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - group: ""
                kind: Service
                name: anomaly51-web
                port: 80
    # The API alias exposes the same bounded public API surface, but never the
    # frontend or internal service routes.
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: anomaly51-api
        labels:
          app.kubernetes.io/name: anomaly51-api
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "1"
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: public
            namespace: networking
            sectionName: https
        hostnames:
          - anomaly51-api.api-api-api.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/auth
            backendRefs:
              - group: ""
                kind: Service
                name: anomaly51-user-service
                port: 80
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/telegram
            backendRefs:
              - group: ""
                kind: Service
                name: anomaly51-telegram-service
                port: 80
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/wallet
              - path:
                  type: PathPrefix
                  value: /api/game
              - path:
                  type: PathPrefix
                  value: /api/crash
              - path:
                  type: PathPrefix
                  value: /api/slots
              - path:
                  type: PathPrefix
                  value: /api/plinko
              - path:
                  type: PathPrefix
                  value: /api/pig-bank
              - path:
                  type: PathPrefix
                  value: /api/truffle-raid
              - path:
                  type: PathPrefix
                  value: /api/health
              - path:
                  type: PathPrefix
                  value: /socket.io
            backendRefs:
              - group: ""
                kind: Service
                name: anomaly51-casino-service
                port: 80
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: anomaly51-default-deny
        labels:
          app.kubernetes.io/name: anomaly51
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-5"
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/part-of: anomaly51
        policyTypes:
          - Ingress
          - Egress
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: anomaly51-allow-required
        labels:
          app.kubernetes.io/name: anomaly51
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-5"
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/part-of: anomaly51
        policyTypes:
          - Ingress
          - Egress
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: anomaly51
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - protocol: TCP
                port: 3000
              - protocol: TCP
                port: 3001
              - protocol: TCP
                port: 3002
              - protocol: TCP
                port: 8080
        egress:
          - to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: anomaly51
          - to:
              - podSelector:
                  matchLabels:
                    app: anomaly51-redis-managed
            ports:
              - protocol: TCP
                port: 6379
          - to:
              - podSelector:
                  matchLabels:
                    strimzi.io/cluster: anomaly51-events
            ports:
              - protocol: TCP
                port: 9092
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          - to:
              - podSelector:
                  matchLabels:
                    cnpg.io/cluster: anomaly51-postgres
            ports:
              - protocol: TCP
                port: 5432
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: rabbitmq-system
            ports:
              - protocol: TCP
                port: 5672
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - protocol: TCP
                port: 443
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: anomaly51-redis-managed
        labels:
          app.kubernetes.io/name: anomaly51-redis
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-5"
      spec:
        podSelector:
          matchLabels:
            app: anomaly51-redis-managed
        policyTypes:
          - Ingress
          - Egress
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: anomaly51
            ports:
              - protocol: TCP
                port: 6379
        # Redis is a leaf service and does not initiate network connections.
        egress: []
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: anomaly51-postgres
        labels:
          app.kubernetes.io/name: anomaly51-postgres
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-5"
      spec:
        podSelector:
          matchLabels:
            cnpg.io/cluster: anomaly51-postgres
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: anomaly51
            ports:
              - protocol: TCP
                port: 5432
          # CloudNativePG reaches the instance manager for reconciliation.
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: database-system
            ports:
              - protocol: TCP
                port: 8000
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: anomaly51-register-webhook
        labels:
          app.kubernetes.io/name: anomaly51-register-webhook
          app.kubernetes.io/component: telegram
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/hook: PostSync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
          argocd.argoproj.io/sync-wave: "1"
      spec:
        backoffLimit: 5
        activeDeadlineSeconds: 300
        template:
          metadata:
            labels:
              app.kubernetes.io/name: anomaly51-register-webhook
              app.kubernetes.io/component: telegram
              app.kubernetes.io/part-of: anomaly51
          spec:
            restartPolicy: Never
            serviceAccountName: anomaly51-prod
            automountServiceAccountToken: false
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: register
                image: docker.io/curlimages/curl:8.12.1
                imagePullPolicy: IfNotPresent
                command:
                  - sh
                  - -ec
                args:
                  - |
                    response="$(curl --silent --show-error --fail-with-body --retry 5 --retry-all-errors \
                      --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
                      --data-urlencode "url=https://anomaly51.api-api-api.com/api/telegram/webhook" \
                      --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
                      --data-urlencode 'allowed_updates=["message"]')"
                    printf '%s' "$response" | grep -q '"ok":true'
                env:
                  - name: TELEGRAM_BOT_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: anomaly51-env
                        key: TELEGRAM_BOT_TOKEN
                  - name: TELEGRAM_WEBHOOK_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: anomaly51-env
                        key: TELEGRAM_WEBHOOK_SECRET
                resources:
                  requests:
                    cpu: 5m
                    memory: 16Mi
                  limits:
                    cpu: 50m
                    memory: 32Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 101
                  runAsGroup: 102
                  capabilities:
                    drop:
                      - ALL
    # Strimzi owns the broker PodSet, Services, certificates and retained PVC.
    - apiVersion: kafka.strimzi.io/v1
      kind: KafkaNodePool
      metadata:
        name: dual-role
        labels:
          strimzi.io/cluster: anomaly51-events
          app.kubernetes.io/name: anomaly51-kafka
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-7"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      spec:
        replicas: 1
        roles:
          - controller
          - broker
        resources:
          requests:
            cpu: 25m
            # The retired broker frees 128Mi; 64Mi leaves room for the operator.
            memory: 64Mi
          limits:
            cpu: 300m
            # The old broker reached 510Mi and OOM-killed at a 512Mi limit.
            memory: 768Mi
        jvmOptions:
          -Xms: 128m
          -Xmx: 256m
          gcLoggingEnabled: false
        storage:
          type: jbod
          volumes:
            - id: 0
              type: persistent-claim
              class: nfs-csi
              size: 2Gi
              deleteClaim: false
              kraftMetadata: shared
        template:
          pod:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            terminationGracePeriodSeconds: 60
    - apiVersion: kafka.strimzi.io/v1
      kind: Kafka
      metadata:
        name: anomaly51-events
        labels:
          app.kubernetes.io/name: anomaly51-kafka
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-6"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      spec:
        kafka:
          version: 4.3.1
          metadataVersion: 4.3-IV0
          listeners:
            - name: plain
              port: 9092
              type: internal
              tls: false
              # The cluster is internal-only. Application pods use the client
              # listener, while the Strimzi operator needs it for AdminClient
              # reconciliation (topics, broker state and listener status).
              networkPolicyPeers:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/part-of: anomaly51
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kafka-system
                  podSelector:
                    matchLabels:
                      strimzi.io/kind: cluster-operator
          config:
            auto.create.topics.enable: true
            num.partitions: 3
            default.replication.factor: 1
            min.insync.replicas: 1
            offsets.topic.num.partitions: 3
            offsets.topic.replication.factor: 1
            transaction.state.log.num.partitions: 1
            transaction.state.log.replication.factor: 1
            transaction.state.log.min.isr: 1
            group.initial.rebalance.delay.ms: 0
    - apiVersion: rabbitmq.com/v1beta1
      kind: Vhost
      metadata:
        name: anomaly51
        labels:
          app.kubernetes.io/name: anomaly51-rabbitmq
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-7"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      spec:
        name: anomaly51
        defaultQueueType: quorum
        deletionPolicy: retain
        rabbitmqClusterReference:
          name: shared
          namespace: rabbitmq-system
    - apiVersion: rabbitmq.com/v1beta1
      kind: User
      metadata:
        name: anomaly51
        labels:
          app.kubernetes.io/name: anomaly51-rabbitmq
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-7"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      spec:
        importCredentialsSecret:
          name: anomaly51-rabbitmq
        rabbitmqClusterReference:
          name: shared
          namespace: rabbitmq-system
    - apiVersion: rabbitmq.com/v1beta1
      kind: Permission
      metadata:
        name: anomaly51
        labels:
          app.kubernetes.io/name: anomaly51-rabbitmq
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-6"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      spec:
        vhost: anomaly51
        userReference:
          name: anomaly51
        permissions:
          configure: ".*"
          write: ".*"
          read: ".*"
        rabbitmqClusterReference:
          name: shared
          namespace: rabbitmq-system
    - apiVersion: v1
      kind: Service
      metadata:
        name: anomaly51-web
        labels:
          app.kubernetes.io/name: anomaly51-web
          app.kubernetes.io/part-of: anomaly51
        annotations:
          argocd.argoproj.io/sync-wave: "-5"
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/name: anomaly51-web
        ports:
          - name: http
            port: 80
            targetPort: http
