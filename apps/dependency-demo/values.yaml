replicaCount: 1

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

initImage:
  repository: busybox
  tag: "1.36.1"
  pullPolicy: IfNotPresent

persistence:
  storageClassName: nfs-client
  accessMode: ReadWriteMany
  size: 64Mi

service:
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

initResources:
  requests:
    cpu: 5m
    memory: 8Mi
  limits:
    cpu: 50m
    memory: 32Mi

content:
  title: General-1 dependency demo
  message: The nginx application is running from an NFS-backed volume.
