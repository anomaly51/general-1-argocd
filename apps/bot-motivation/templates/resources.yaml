apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bot-motivation-data
  labels:
    app.kubernetes.io/name: bot-motivation
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: bot-motivation
  labels:
    app.kubernetes.io/name: bot-motivation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bot-motivation
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bot-motivation
  labels:
    app.kubernetes.io/name: bot-motivation
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
      sectionName: {{ .Values.route.gatewaySectionName }}
  hostnames:
    - {{ .Values.route.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: bot-motivation
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-motivation
  labels:
    app.kubernetes.io/name: bot-motivation
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-motivation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-motivation
    spec:
      serviceAccountName: bot-motivation
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      imagePullSecrets:
        - name: bot-motivation-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /tmp
          command:
            - python
          args:
            - /app/bot.py
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: "8080"
            - name: BOT_DB_PATH
              value: /data/bot_data.db
            - name: TIKTOK_COOKIES_PATH
              value: /secrets/cookies.txt
            - name: RAPID_API_PROVIDER
              value: {{ .Values.rapidApi.provider | quote }}
            - name: SCRAPTIK_API_HOST
              value: {{ .Values.rapidApi.host | quote }}
            - name: SCRAPTIK_API_URL
              value: {{ .Values.rapidApi.url | quote }}
            - name: TMA_BASE_URL
              value: "https://{{ .Values.route.hostname }}"
            - name: CASINO_WEBAPP_URL
              value: "https://{{ .Values.route.hostname }}/casino"
          envFrom:
            - secretRef:
                name: bot-motivation-env
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cookies
              mountPath: /secrets/cookies.txt
              subPath: cookies.txt
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bot-motivation-data
        - name: cookies
          secret:
            secretName: bot-motivation-cookies
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
