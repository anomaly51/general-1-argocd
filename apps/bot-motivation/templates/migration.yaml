{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: bot-motivation-data-migration-v1
  labels:
    app.kubernetes.io/name: bot-motivation
    app.kubernetes.io/component: data-migration
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-motivation
        app.kubernetes.io/component: data-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      imagePullSecrets:
        - name: bot-motivation-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate-sqlite
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
          args:
            - |
              import hashlib
              import os
              from pathlib import Path
              import sqlite3
              import stat
              import time

              source = Path("/source/bot_data.db")
              target_dir = Path("/data")
              target = target_dir / "bot_data.db"
              temporary = target_dir / ".bot_data.db.migration-v1.tmp"
              marker = target_dir / ".bot_data.db.migration-v1.complete"
              marker_temporary = target_dir / ".bot_data.db.migration-v1.complete.tmp"
              preflight = target_dir / ".bot_data.db.migration-v1.preflight"

              def sha256(path):
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  return digest.digest()

              def quick_check(path):
                  connection = sqlite3.connect(
                      f"file:{path}?mode=ro&immutable=1", uri=True
                  )
                  try:
                      result = connection.execute("PRAGMA quick_check").fetchall()
                  finally:
                      connection.close()
                  if result != [("ok",)]:
                      raise RuntimeError(f"SQLite quick_check failed for {path.name}")

              def fsync_directory(path):
                  descriptor = os.open(path, os.O_RDONLY | os.O_DIRECTORY)
                  try:
                      os.fsync(descriptor)
                  finally:
                      os.close(descriptor)

              def write_marker():
                  if marker.exists():
                      return
                  if marker_temporary.exists():
                      if marker_temporary.is_symlink():
                          raise RuntimeError("refusing marker symlink")
                      marker_temporary.unlink()
                  descriptor = os.open(
                      marker_temporary,
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL,
                      0o600,
                  )
                  with os.fdopen(descriptor, "wb") as stream:
                      stream.write(b"migration-v1\n")
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(marker_temporary, marker)
                  fsync_directory(target_dir)

              if not source.is_file():
                  raise RuntimeError("source database is absent")
              for suffix in ("-wal", "-shm", "-journal"):
                  if Path(str(source) + suffix).exists():
                      raise RuntimeError(f"source has an active SQLite sidecar: {suffix}")

              first_stat = source.stat()
              time.sleep(3)
              second_stat = source.stat()
              if (first_stat.st_size, first_stat.st_mtime_ns) != (
                  second_stat.st_size,
                  second_stat.st_mtime_ns,
              ):
                  raise RuntimeError("source database changed during stability check")

              quick_check(source)
              source_digest = sha256(source)

              if preflight.exists():
                  if preflight.is_symlink():
                      raise RuntimeError("refusing preflight symlink")
                  preflight.unlink()
              descriptor = os.open(
                  preflight,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL,
                  0o600,
              )
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(b"preflight\n")
                  stream.flush()
                  os.fsync(stream.fileno())
                  os.fchmod(stream.fileno(), 0o600)
              preflight.unlink()
              fsync_directory(target_dir)

              if target.exists():
                  quick_check(target)
                  if sha256(target) != source_digest:
                      raise RuntimeError("existing target differs from source")
                  write_marker()
                  print(f"migration_already_complete bytes={target.stat().st_size}")
                  raise SystemExit(0)

              if marker.exists():
                  raise RuntimeError("completion marker exists without target database")
              if temporary.exists():
                  if temporary.is_symlink():
                      raise RuntimeError("refusing temporary-file symlink")
                  temporary.unlink()

              descriptor = os.open(
                  temporary,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL,
                  0o600,
              )
              with source.open("rb") as source_stream, os.fdopen(
                  descriptor, "wb"
              ) as target_stream:
                  for chunk in iter(lambda: source_stream.read(1024 * 1024), b""):
                      target_stream.write(chunk)
                  target_stream.flush()
                  os.fsync(target_stream.fileno())
                  os.fchmod(target_stream.fileno(), 0o600)

              if source.stat().st_mtime_ns != second_stat.st_mtime_ns:
                  raise RuntimeError("source database changed during copy")
              if temporary.stat().st_size != second_stat.st_size:
                  raise RuntimeError("copied database size mismatch")
              if sha256(temporary) != source_digest:
                  raise RuntimeError("copied database checksum mismatch")
              quick_check(temporary)

              os.replace(temporary, target)
              fsync_directory(target_dir)
              write_marker()

              target_stat = target.stat()
              if target_stat.st_uid != 10001 or target_stat.st_gid != 10001:
                  raise RuntimeError("target database ownership mismatch")
              if stat.S_IMODE(target_stat.st_mode) != 0o600:
                  raise RuntimeError("target database permissions mismatch")
              print(f"migration_complete bytes={target_stat.st_size}")
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /data
      volumes:
        - name: source
          nfs:
            server: {{ .Values.migration.source.server }}
            path: {{ .Values.migration.source.path }}
            readOnly: true
        - name: target
          persistentVolumeClaim:
            claimName: bot-motivation-data
{{- end }}
