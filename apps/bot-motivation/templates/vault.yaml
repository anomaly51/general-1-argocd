apiVersion: v1
kind: ServiceAccount
metadata:
  name: bot-motivation
  labels:
    app.kubernetes.io/name: bot-motivation
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: bot-motivation
  labels:
    app.kubernetes.io/name: bot-motivation
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: {{ .Values.vault.authMount }}
  kubernetes:
    role: {{ .Values.vault.role }}
    serviceAccount: bot-motivation
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: bot-motivation-env
  labels:
    app.kubernetes.io/name: bot-motivation
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: bot-motivation
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.path }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    create: true
    name: bot-motivation-env
    transformation:
      includes:
        - ^(BOT_TOKEN|OPENROUTER_API_KEY|RAPID_API_KEY|GROUP_CHAT_ID|ADMIN_ID)$
  rolloutRestartTargets:
    - kind: Deployment
      name: bot-motivation
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: bot-motivation-cookies
  labels:
    app.kubernetes.io/name: bot-motivation
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: bot-motivation
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.path }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    create: true
    name: bot-motivation-cookies
    transformation:
      includes:
        - '^cookies[.]txt$'
  rolloutRestartTargets:
    - kind: Deployment
      name: bot-motivation
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: bot-motivation-registry
  labels:
    app.kubernetes.io/name: bot-motivation
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: bot-motivation
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.registry.vaultPath }}
  refreshAfter: 1h
  destination:
    create: true
    name: bot-motivation-registry
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludes:
        - .*
      templates:
        .dockerconfigjson:
          text: |
            {"auths":{"{{ .Values.registry.server }}":{"username":"{{ `{{ get .Secrets "username" }}` }}","password":"{{ `{{ get .Secrets "password" }}` }}"}}}
  rolloutRestartTargets:
    - kind: Deployment
      name: bot-motivation
