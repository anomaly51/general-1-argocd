{{- $secretName := required "secret.name is required" .Values.secret.name -}}
{{- $secretKey := required "secret.key is required" .Values.secret.key -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-{{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # VSO resolves the operator-owned vault-system/VaultConnection/default.
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ required "vault.role is required" .Values.vault.role }}
    serviceAccount: vso-{{ .Release.Name }}
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: {{ .Release.Name }}
  mount: {{ required "vault.mount is required" .Values.vault.mount }}
  type: kv-v2
  path: {{ required "vault.path is required" .Values.vault.path }}
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: {{ $secretName }}
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - {{ printf "^%s$" $secretKey | quote }}
