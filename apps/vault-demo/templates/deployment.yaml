apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-demo
      app.kubernetes.io/instance: vault-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-demo
        app.kubernetes.io/instance: vault-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: busybox:1.37.0
          command: ["httpd"]
          args: ["-f", "-p", "8080", "-h", "/www"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: secret
              mountPath: /www
              readOnly: true
      volumes:
        - name: secret
          secret:
            secretName: vault-demo
            items:
              - key: message
                path: index.html
