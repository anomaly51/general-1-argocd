apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "cutline.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: {{ .Values.vault.authMount }}
  kubernetes:
    role: {{ .Values.vault.role }}
    serviceAccount: {{ .Release.Name }}
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-env
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ .Release.Name }}
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.envPath }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    create: true
    name: {{ .Release.Name }}-env
    transformation:
      excludes: ["^POSTGRES_.*$"]
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}-api
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-postgres-env
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ .Release.Name }}
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.envPath }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    create: true
    name: {{ .Release.Name }}-postgres-env
    transformation:
      excludes: [".*"]
      templates:
        POSTGRES_USER:
          text: '{{ `{{ get .Secrets "POSTGRES_USER" }}` }}'
        POSTGRES_PASSWORD:
          text: '{{ `{{ get .Secrets "POSTGRES_PASSWORD" }}` }}'
        POSTGRES_DB:
          text: '{{ `{{ get .Secrets "POSTGRES_DB" }}` }}'
  rolloutRestartTargets:
    - kind: StatefulSet
      name: {{ .Release.Name }}-postgres
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ .Release.Name }}
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.authPath }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    create: true
    name: {{ .Release.Name }}-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}-oauth2-proxy
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ .Release.Name }}
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.registry.vaultPath }}
  refreshAfter: 1h
  destination:
    create: true
    name: {{ .Release.Name }}-registry
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludes: [".*"]
      templates:
        .dockerconfigjson:
          text: |
            {"auths":{"{{ .Values.registry.server }}":{"username":"{{ `{{ get .Secrets "username" }}` }}","password":"{{ `{{ get .Secrets "password" }}` }}"}}}
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}-api
    - kind: Deployment
      name: {{ .Release.Name }}-frontend
