apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "cutline.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "cutline.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cutline.selector" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      affinity:
        {{- include "cutline.workerAffinity" . | nindent 8 }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-postgres-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata17
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              # libpq must time out before kubelet forcibly terminates the exec.
              command: [sh, -ec, 'exec pg_isready -h 127.0.0.1 -t 5 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [sh, -ec, 'exec pg_isready -h 127.0.0.1 -t 5 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            # Recovery can reject SQL clients while the postmaster is healthy.
            # Keep it alive to finish NFS recovery; readiness still gates traffic.
            # Explicitly remove the old handler during server-side apply.
            exec: null
            tcpSocket:
              port: postgres
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tmp, mountPath: /tmp}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-postgres
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: run
          emptyDir: {sizeLimit: 16Mi}
