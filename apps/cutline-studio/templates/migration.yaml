{{- if .Values.migration.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-migration
  labels:
    {{- include "cutline.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cutline.selector" (dict "root" . "component" "migration") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cutline.selector" (dict "root" . "component" "migration") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      affinity:
        {{- include "cutline.workerAffinity" . | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore-tools
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          # Contains pg_restore, psql and tar. No restore or data deletion is automatic.
          command: [sh, -ec]
          args:
            - trap 'exit 0' TERM INT; while true; do sleep 3600 & wait $!; done
          env:
            - {name: PGHOST, value: "{{ .Release.Name }}-postgres"}
            - {name: PGPORT, value: "5432"}
            {{- range $key, $source := dict "PGUSER" "POSTGRES_USER" "PGPASSWORD" "POSTGRES_PASSWORD" "PGDATABASE" "POSTGRES_DB" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-postgres-env
                  key: {{ $source }}
            {{- end }}
            - {name: HOME, value: /tmp}
          resources:
            {{- toYaml .Values.resources.migration | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
{{- end }}
