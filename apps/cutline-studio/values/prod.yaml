# Chart version used by Argo CD; the remaining keys are Helm values.
_release:
  revision: 0.1.12
  repository: harbor.internal.api-api-api.com/cutline-studio

# Complete environment configuration; this chart has no shared values.yaml.
images:
  api:
    repository: harbor.internal.api-api-api.com/cutline-studio/api
    pullPolicy: IfNotPresent
    tag: sha-b474bb1f3962
  frontend:
    repository: harbor.internal.api-api-api.com/cutline-studio/frontend
    pullPolicy: IfNotPresent
    tag: sha-b474bb1f3962
  oauth2Proxy:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.3
    pullPolicy: IfNotPresent
  postgres:
    repository: docker.io/library/postgres
    tag: 17-bookworm
    pullPolicy: IfNotPresent
replicas:
  api: 1
  frontend: 1
  oauth2Proxy: 1
migration:
  enabled: false
routes:
  hostname: cutline-general1.api-api-api.com
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  timeout: 1800s
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/cutline-studio/registry
vault:
  mount: kv
  authMount: kubernetes
  role: cutline-studio
  envPath: apps/cutline-studio/env
  authPath: apps/cutline-studio/auth
  refreshAfter: 1m
storage:
  className: nfs-csi
  dataSize: 30Gi
  postgresSize: 10Gi
  apiTmpSize: 4Gi
  apiSharedMemorySize: 512Mi
api:
  nodeSelector:
    kubernetes.io/hostname: general-1-worker-1
  maxActiveJobs: 1
  recoverGenerationJobs: false
  purgeLegacyData: false
  telegramBotEnabled: false
  telegramDailyMemesEnabled: false
auth:
  allowedGroup: cutline-studio-owner
  cookieExpire: 8h
  cookieRefresh: 15m
  upstreamTimeout: 30m
  trustedProxyCIDR: 10.42.0.0/16
networkPolicy:
  gatewayNamespace: kube-system
  gatewayPodLabel: traefik
  identityNamespace: authentik
  internalGatewayCIDR: 192.168.1.3/32
resources:
  api:
    requests:
      cpu: 250m
      memory: 384Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: '2'
      memory: 512Mi
      ephemeral-storage: 6Gi
  frontend:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  oauth2Proxy:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  postgres:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  migration:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
