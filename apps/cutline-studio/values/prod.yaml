_release:
  revision: 0.1.19
  repository: harbor.internal.api-api-api.com/cutline-studio
  sourceRepository: anomaly51/cutline-studio
  sourceCommit: cf9b104b5ad7816be57d2e710e17b601f9a5a282
  sourceBranch: main
  runUrl: https://github.com/anomaly51/cutline-studio/actions/runs/38094548754
  imageKeys:
  - images.api
  - images.frontend
images:
  api:
    repository: harbor.internal.api-api-api.com/cutline-studio/api
    pullPolicy: IfNotPresent
    tag: sha-cf9b104b5ad7@sha256:cb1581354110d8a6f108abc14047554155f477a148be8638cf279fd045e10b50
  frontend:
    repository: harbor.internal.api-api-api.com/cutline-studio/frontend
    pullPolicy: IfNotPresent
    tag: sha-cf9b104b5ad7@sha256:10c9c1c7c91bb9a50b469b39a16dbb7190f465a212a64556848332d2af1d9250
  postgres:
    repository: docker.io/library/postgres
    tag: 17-bookworm
    pullPolicy: IfNotPresent
replicas:
  api: 1
  frontend: 1
migration:
  enabled: false
routes:
  enabled: true
  hostname: cutline-general1.api-api-api.com
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  timeout: 1800s
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/cutline-studio/registry
vault:
  mount: kv
  authMount: kubernetes
  role: cutline-studio
  envPath: apps/cutline-studio/env
  refreshAfter: 1m
storage:
  className: nfs-csi
  dataSize: 30Gi
  postgresSize: 10Gi
  apiTmpSize: 4Gi
  apiSharedMemorySize: 512Mi
api:
  nodeSelector:
    kubernetes.io/hostname: general-1-worker-1
  maxActiveJobs: 1
  recoverGenerationJobs: false
  purgeLegacyData: false
  telegramBotEnabled: false
  telegramDailyMemesEnabled: false
networkPolicy:
  gatewayNamespace: kube-system
  gatewayPodLabel: traefik
resources:
  api:
    requests:
      cpu: 250m
      memory: 384Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: '2'
      memory: 512Mi
      ephemeral-storage: 6Gi
  frontend:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  postgres:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  migration:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
