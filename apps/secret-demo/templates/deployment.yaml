apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-demo
      app.kubernetes.io/instance: secret-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-demo
        app.kubernetes.io/instance: secret-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              printf '%s' "$MESSAGE" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - name: MESSAGE
              value: "Hello from Kubernetes Secret"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /www
      volumes:
        - name: content
          emptyDir: {}
