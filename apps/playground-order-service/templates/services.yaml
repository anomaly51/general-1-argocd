apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.appService.name }}
    app.kubernetes.io/part-of: playground
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.appService.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.appService.port }}
      targetPort: http
      protocol: TCP
---
{{- if .Values.relay.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.relayService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.relayService.name }}
    app.kubernetes.io/part-of: playground
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.relayService.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.relayService.port }}
      targetPort: http
      protocol: TCP
{{- end }}
