apiVersion: v1
kind: Service
metadata:
  name: shisha-guid-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shisha-guid-backend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shisha-guid-backend
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
      sectionName: {{ .Values.route.gatewaySectionName }}
  hostnames:
    - {{ .Values.route.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: shisha-guid-backend
          port: {{ .Values.service.port }}
