apiVersion: apps/v1
kind: Deployment
metadata:
  name: shisha-guid-backend
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shisha-guid-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shisha-guid-backend
    spec:
      serviceAccountName: shisha-guid-backend
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      imagePullSecrets:
        - name: shisha-guid-backend-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-storage
          image: "{{ .Values.images.wait.repository }}:{{ .Values.images.wait.tag }}"
          imagePullPolicy: {{ .Values.images.wait.pullPolicy }}
          command:
            - sh
            - -ec
            - until nc -z shisha-guid-backend-postgres 5432 && nc -z shisha-guid-backend-minio 9000; do sleep 2; done
          resources:
            {{- toYaml .Values.resources.wait | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          env:
            - name: API_PUBLIC_URL
              value: {{ .Values.config.apiPublicUrl | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.config.minioEndpoint | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.config.minioBucket | quote }}
            - name: MINIO_SECURE
              value: "false"
            - name: MAX_UPLOAD_BYTES
              value: {{ .Values.config.maxUploadBytes | quote }}
            - name: RUN_SCHEMA_BOOTSTRAP
              value: "true"
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "5"
          envFrom:
            - secretRef:
                name: shisha-guid-backend-env
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
