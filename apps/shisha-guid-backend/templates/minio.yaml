apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shisha-guid-backend-minio
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.minioSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: shisha-guid-backend-minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shisha-guid-backend-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shisha-guid-backend-minio
spec:
  serviceName: shisha-guid-backend-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shisha-guid-backend-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shisha-guid-backend-minio
    spec:
      serviceAccountName: shisha-guid-backend
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: minio
          image: "{{ .Values.images.minio.repository }}:{{ .Values.images.minio.tag }}"
          imagePullPolicy: {{ .Values.images.minio.pullPolicy }}
          args:
            - server
            - /data
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: shisha-guid-backend-env
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shisha-guid-backend-env
                  key: MINIO_SECRET_KEY
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: api
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.minio | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shisha-guid-backend-minio
