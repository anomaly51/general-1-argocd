_release:
  repository: harbor.internal.api-api-api.com/helm-charts
  chart: app
  revision: 0.6.0
  policy: promote
  namespace: playground-staging
  sourceRepository: anomaly51/playground-pricing-service
replicaCount: 1
nodeSelector:
  kubernetes.io/hostname: general-1-worker-2
image:
  repository: harbor.internal.api-api-api.com/playground/pricing-service
  tag: staging@sha256:3c49adb7cca05542f9adea2aa1e966cff082e0ad61949def705e51388907362e
  pullPolicy: IfNotPresent
serviceAccountName: playground-runtime
env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  LAB_PROCESSOR_HTTP_HOST: 0.0.0.0
  LAB_PROCESSOR_HTTP_PORT: '8001'
  LAB_KAFKA_ENABLED: 'true'
  LAB_KAFKA_BOOTSTRAP_SERVERS: playground-kafka-kafka-bootstrap:9092
  FLASHDROP_KAFKA_TRACE_TOPIC: flashdrop.traces.v1
  FLASHDROP_KAFKA_CLIENT_ID: flashdrop-pricing-service
  FLASHDROP_PRICING_QUOTE_TIMEOUT_SECONDS: '2.0'
  FLASHDROP_PRICING_TIMEOUT_DELAY_SECONDS: '3.0'
  LAB_KAFKA_PUBLISH_TIMEOUT_SECONDS: '2.0'
  LAB_KAFKA_PROBE_INTERVAL_SECONDS: '2.0'
  LAB_KAFKA_PROBE_TIMEOUT_SECONDS: '1.0'
  LAB_PROCESSOR_SHUTDOWN_GRACE_SECONDS: '10.0'
  LAB_PROCESSOR_MAX_REQUEST_BYTES: '1048576'
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 16Mi
  limits:
    cpu: 500m
    memory: 192Mi
    ephemeral-storage: 128Mi
name: pricing-service
resourceName: pricing-service
containerName: pricing-service
includeStandardLabels: false
labels:
  app.kubernetes.io/name: pricing-service
  app.kubernetes.io/part-of: playground
podLabels:
  app.kubernetes.io/part-of: playground
  app.kubernetes.io/component: backend
revisionHistoryLimit: 2
progressDeadlineSeconds: 600
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
automountServiceAccountToken: false
terminationGracePeriodSeconds: 30
imagePullSecrets:
- name: playground-registry
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist
        - key: node-role.kubernetes.io/master
          operator: DoesNotExist
ports:
- name: http
  containerPort: 8001
service:
  enabled: true
  type: ClusterIP
  port: 8001
  targetPort: http
  protocol: TCP
extraVolumes:
- name: tmp
  emptyDir:
    sizeLimit: 32Mi
extraVolumeMounts:
- name: tmp
  mountPath: /tmp
envFrom:
- secretRef:
    name: playground-env
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
