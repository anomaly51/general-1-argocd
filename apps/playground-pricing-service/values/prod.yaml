# Complete prod-only configuration; there is no shared values.yaml.
_release:
  revision: 099e94b57239733bf44e0df1f1c255b4a5cf0193
  policy: prod-only
  namespace: playground-prod
  sourceRepository: anomaly51/playground-pricing-service

replicaCount: 1
component: backend
appService:
  name: pricing-service
  port: 8001
image:
  repository: harbor.internal.api-api-api.com/playground/pricing-service
  tag: prod@sha256:6c534d187028a808d805fbee6750849da425714805bd07d379a9ba3a03e2f177
  pullPolicy: IfNotPresent
serviceAccountName: playground-runtime
imagePullSecret: playground-registry
envSecret: playground-env
probes:
  livenessPath: /healthz
  readinessPath: /readyz
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 16Mi
  limits:
    cpu: 500m
    memory: 192Mi
    ephemeral-storage: 128Mi
scratchVolumes:
  - name: tmp
    mountPath: /tmp
    sizeLimit: 32Mi
env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  LAB_PROCESSOR_HTTP_HOST: "0.0.0.0"
  LAB_PROCESSOR_HTTP_PORT: "8001"
  LAB_KAFKA_ENABLED: "true"
  LAB_KAFKA_BOOTSTRAP_SERVERS: "playground-kafka-kafka-bootstrap:9092"
  FLASHDROP_KAFKA_TRACE_TOPIC: "flashdrop.traces.v1"
  FLASHDROP_KAFKA_CLIENT_ID: "flashdrop-pricing-service"
  FLASHDROP_PRICING_QUOTE_TIMEOUT_SECONDS: "2.0"
  FLASHDROP_PRICING_TIMEOUT_DELAY_SECONDS: "3.0"
  LAB_KAFKA_PUBLISH_TIMEOUT_SECONDS: "2.0"
  LAB_KAFKA_PROBE_INTERVAL_SECONDS: "2.0"
  LAB_KAFKA_PROBE_TIMEOUT_SECONDS: "1.0"
  LAB_PROCESSOR_SHUTDOWN_GRACE_SECONDS: "10.0"
  LAB_PROCESSOR_MAX_REQUEST_BYTES: "1048576"
