apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: interviews-tracker-cassandra
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests: {storage: {{ .Values.storage.size }}}
---
apiVersion: v1
kind: Service
metadata:
  name: interviews-tracker-cassandra
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: interviews-tracker-cassandra}
  ports: [{name: cql, port: 9042, targetPort: cql}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: interviews-tracker-cassandra
spec:
  replicas: 1
  serviceName: interviews-tracker-cassandra
  selector:
    matchLabels: {app.kubernetes.io/name: interviews-tracker-cassandra}
  template:
    metadata:
      labels: {app.kubernetes.io/name: interviews-tracker-cassandra}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      containers:
        - name: cassandra
          image: {{ printf "%s:%s" .Values.images.cassandra.repository .Values.images.cassandra.tag | quote }}
          env:
            - {name: CASSANDRA_CLUSTER_NAME, value: InterviewTrackerCluster}
            - {name: CASSANDRA_DC, value: datacenter1}
            - {name: CASSANDRA_ENDPOINT_SNITCH, value: GossipingPropertyFileSnitch}
            - {name: MAX_HEAP_SIZE, value: 512M}
            - {name: HEAP_NEWSIZE, value: 100M}
          ports: [{name: cql, containerPort: 9042}]
          startupProbe:
            tcpSocket: {port: cql}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: cql}
          livenessProbe:
            tcpSocket: {port: cql}
            periodSeconds: 30
            failureThreshold: 5
          resources: {{ .Values.resources.cassandra | toJson }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/cassandra}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: interviews-tracker-cassandra}
---
# Cassandra is reachable only by this application's API in the same namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: interviews-tracker-cassandra
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: interviews-tracker-cassandra}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: interviews-tracker-api}
      ports: [{protocol: TCP, port: 9042}]
