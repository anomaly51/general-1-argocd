{{- with (default dict .Values.images.voice) }}
{{- if .tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interviews-tracker-voice
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: interviews-tracker-voice}
  template:
    metadata:
      labels: {app.kubernetes.io/name: interviews-tracker-voice}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ $.Values.nodeSelector | toJson }}
      imagePullSecrets: [{name: interviews-tracker-registry}]
      containers:
        - name: voice
          image: {{ printf "%s:%s" .repository .tag | quote }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: APP_HERMES_DRAFT_TOKEN
              valueFrom:
                secretKeyRef: {name: interviews-tracker-oauth, key: APP_HERMES_DRAFT_TOKEN}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ $.Values.resources.voice | toJson }}
---
apiVersion: v1
kind: Service
metadata:
  name: interviews-tracker-voice
spec:
  selector: {app.kubernetes.io/name: interviews-tracker-voice}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
{{- end }}
