# Blocked: no BOT_TOKEN is currently available for this workload in Vault.
# Keep the polling deployment disabled until that credential has been provisioned.
replicas: 0

image:
  repository: harbor.internal.api-api-api.com/applications/telegram-bot
  # Replaced with an immutable sha-* tag after the first image is published.
  tag: sha-1abadd7abcc4
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

postgresql:
  image:
    repository: postgres
    tag: 16.4-bookworm
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    storageClassName: nfs-csi
    size: 2Gi
