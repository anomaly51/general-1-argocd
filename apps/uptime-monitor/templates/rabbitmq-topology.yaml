apiVersion: rabbitmq.com/v1beta1
kind: Vhost
metadata:
  name: uptime-monitor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: uptime-monitor
  defaultQueueType: quorum
  deletionPolicy: retain
  rabbitmqClusterReference:
    name: shared
    namespace: rabbitmq-system
---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: uptime-monitor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  importCredentialsSecret:
    name: uptime-monitor-env
  rabbitmqClusterReference:
    name: shared
    namespace: rabbitmq-system
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: uptime-monitor
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  vhost: uptime-monitor
  userReference:
    name: uptime-monitor
  permissions:
    configure: ".*"
    write: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: shared
    namespace: rabbitmq-system
