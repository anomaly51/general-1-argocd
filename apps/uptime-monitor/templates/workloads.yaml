apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-monitor-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-monitor-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-monitor-api
    spec:
      serviceAccountName: uptime-monitor
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      imagePullSecrets:
        - name: uptime-monitor-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36.1
          command:
            - sh
            - -ec
            - until nc -z uptime-monitor-postgres 5432 && nc -z uptime-monitor-rabbitmq 5672; do sleep 2; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          env:
            - name: PROJECT_NAME
              value: Uptime Monitor
            - name: APP_BASE_URL
              value: "https://{{ .Values.routes.frontendHostname }}"
            - name: CORS_ORIGINS
              value: "https://{{ .Values.routes.frontendHostname }}"
            - name: JWT_ISSUER
              value: uptime-monitor-api
            - name: JWT_AUDIENCE
              value: uptime-monitor-client
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "1440"
            - name: REFRESH_TOKEN_EXPIRE_DAYS
              value: "14"
            - name: CHECK_QUEUE_NAME
              value: monitor_checks
            - name: SCHEDULER_TICK_SECONDS
              value: "30"
          envFrom:
            - secretRef:
                name: uptime-monitor-env
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
