apiVersion: v1
kind: ServiceAccount
metadata:
  name: uptime-monitor-rabbitmq-recreator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uptime-monitor-rabbitmq-recreator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    resourceNames:
      - uptime-monitor-rabbitmq-0
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uptime-monitor-rabbitmq-recreator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uptime-monitor-rabbitmq-recreator
subjects:
  - kind: ServiceAccount
    name: uptime-monitor-rabbitmq-recreator
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: uptime-monitor-rabbitmq-recreate-v1
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-monitor-rabbitmq-recreator
    spec:
      serviceAccountName: uptime-monitor-rabbitmq-recreator
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recreate-rabbitmq-pod
          image: registry.k8s.io/kubectl:v1.35.4
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
          args:
            - --namespace
            - {{ .Release.Namespace }}
            - delete
            - pod
            - uptime-monitor-rabbitmq-0
            - --ignore-not-found=true
            - --wait=false
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
