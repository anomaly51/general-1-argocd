apiVersion: v1
kind: Service
metadata:
  name: uptime-monitor-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: uptime-monitor-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-monitor-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: uptime-monitor-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-monitor-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.routes.gatewayName }}
      namespace: {{ .Values.routes.gatewayNamespace }}
      sectionName: {{ .Values.routes.gatewaySectionName }}
  hostnames:
    - {{ .Values.routes.apiHostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: uptime-monitor-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-monitor-frontend
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.routes.gatewayName }}
      namespace: {{ .Values.routes.gatewayNamespace }}
      sectionName: {{ .Values.routes.gatewaySectionName }}
  hostnames:
    - {{ .Values.routes.frontendHostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: uptime-monitor-frontend
          port: 80
