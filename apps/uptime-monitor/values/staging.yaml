# Complete isolated environment; activated after the first CI release.
_release:
  revision: f786d0cae09f7e93de4c9352543b722eddca8e09
images:
  api:
    repository: harbor.internal.api-api-api.com/applications/uptime-monitor-api
    tag: sha-ea2c079c282a
    pullPolicy: IfNotPresent
  frontend:
    repository: harbor.internal.api-api-api.com/applications/uptime-monitor-frontend
    tag: sha-ea2c079c282a
    pullPolicy: IfNotPresent
  postgres:
    repository: docker.io/library/postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/uptime-monitor/staging/registry
vault:
  mount: kv
  authMount: kubernetes
  role: uptime-monitor-staging
  envPath: apps/uptime-monitor/staging/env
  refreshAfter: 1m
routes:
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  frontendHostname: uptime-staging-general1.api-api-api.com
  apiHostname: uptime-api-staging-general1.api-api-api.com
storage:
  className: nfs-csi
  postgresSize: 2Gi
  legacyRabbitmqSize: 2Gi
resources:
  api:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi
  worker:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi
  scheduler:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 192Mi
  bot:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 192Mi
  frontend:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  postgres:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 384Mi
replicas:
  bot: 0
rabbitmq:
  vhost: uptime-monitor-staging
