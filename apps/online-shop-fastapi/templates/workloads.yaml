apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shop-fastapi-backend
spec:
  replicas: {{ .Values.replicas.backend }}
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: online-shop-fastapi-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: online-shop-fastapi-backend
    spec:
      serviceAccountName: online-shop-fastapi
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      imagePullSecrets:
        - name: online-shop-fastapi-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              until python -c 'import socket; socket.create_connection(("online-shop-fastapi-postgres", 5432), 2).close()'; do
                sleep 2
              done
              alembic upgrade head
          env:
            - name: ENVIRONMENT
              value: production
            - name: APP_BASE_URL
              value: "https://{{ .Values.routes.apiHostname }}"
            - name: CORS_ORIGINS
              value: "https://{{ .Values.routes.frontendHostname }}"
          envFrom:
            - secretRef:
                name: online-shop-fastapi-env
          resources:
            {{- toYaml .Values.resources.migration | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          env:
            - name: ENVIRONMENT
              value: production
            - name: APP_BASE_URL
              value: "https://{{ .Values.routes.apiHostname }}"
            - name: CORS_ORIGINS
              value: "https://{{ .Values.routes.frontendHostname }}"
          envFrom:
            - secretRef:
                name: online-shop-fastapi-env
          ports:
            - name: http
              containerPort: {{ .Values.services.backend.containerPort }}
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: uploads
              mountPath: /code/static/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: online-shop-fastapi-uploads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shop-fastapi-frontend
spec:
  replicas: {{ .Values.replicas.frontend }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: online-shop-fastapi-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: online-shop-fastapi-frontend
    spec:
      serviceAccountName: online-shop-fastapi
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      imagePullSecrets:
        - name: online-shop-fastapi-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.frontend.containerPort }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
