replicas:
  backend: 1
  frontend: 1

images:
  backend:
    repository: harbor.internal.api-api-api.com/applications/online-shop-fastapi
    tag: sha-26a13af3f939
    pullPolicy: IfNotPresent
  frontend:
    repository: harbor.internal.api-api-api.com/applications/online-shop-frontend
    tag: sha-26a13af3f939
    pullPolicy: IfNotPresent
  postgres:
    repository: docker.io/library/postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent

registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/registry

vault:
  mount: kv
  authMount: kubernetes
  role: online-shop-fastapi
  # The Vault secret must supply DATABASE_URL, POSTGRES_USER,
  # POSTGRES_PASSWORD, POSTGRES_DB, SECRET_KEY, JWT_SECRET_KEY, and
  # SESSION_SECRET_KEY. Optional identity-provider and Sentry settings may
  # live at the same path.
  envPath: apps/online-shop-fastapi
  refreshAfter: 1m

routes:
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  frontendHostname: online-shop-general1.api-api-api.com
  apiHostname: online-shop-api-general1.api-api-api.com

services:
  backend:
    port: 80
    containerPort: 8000
  frontend:
    port: 80
    containerPort: 80

storage:
  className: nfs-csi
  postgresSize: 5Gi
  uploadsSize: 5Gi

resources:
  backend:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 320Mi
  migration:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi
  frontend:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  postgres:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
