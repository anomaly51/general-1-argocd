_release:
  repository: harbor.internal.api-api-api.com/helm-charts
  chart: app
  revision: 0.6.0
  policy: promote
  namespace: playground-staging
  sourceRepository: anomaly51/playground-analytics-service
  sourceCommit: 2e1cef9d2d253c988103f4f0552de30f7a001c28
  sourceBranch: main
  runUrl: https://github.com/anomaly51/playground-analytics-service/actions/runs/37273505209
  imageKeys:
  - image
replicaCount: 1
nodeSelector:
  kubernetes.io/hostname: general-1-worker-2
image:
  repository: harbor.internal.api-api-api.com/playground/analytics-service
  tag: main-2e1cef9d2d253c988103f4f0552de30f7a001c28@sha256:bddebc0ff7c7a0d5f933c0d078ab894ce5f247f36621e4f2f475ee5d121e6196
  pullPolicy: IfNotPresent
serviceAccountName: playground-runtime
env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  FLASHDROP_ANALYTICS_HOST: 0.0.0.0
  LAB_ANALYTICS_PORT: '8002'
  LAB_KAFKA_ENABLED: 'true'
  FLASHDROP_KAFKA_BOOTSTRAP_SERVERS: playground-kafka-kafka-bootstrap:9092
  FLASHDROP_KAFKA_ORDERS_TOPIC: flashdrop.orders.v1
  FLASHDROP_KAFKA_ANALYTICS_TOPIC: flashdrop.analytics.v1
  FLASHDROP_KAFKA_TRACE_TOPIC: flashdrop.traces.v1
  FLASHDROP_ANALYTICS_GROUP_ID: flashdrop-analytics-v1
  FLASHDROP_ANALYTICS_KAFKA_CLIENT_ID: flashdrop-analytics
  LAB_KAFKA_PUBLISH_TIMEOUT_SECONDS: '3.0'
  LAB_KAFKA_PROBE_INTERVAL_SECONDS: '2.0'
  LAB_KAFKA_PROBE_TIMEOUT_SECONDS: '1.0'
  FLASHDROP_ANALYTICS_RETRY_MAX_SECONDS: '10.0'
  LAB_ANALYTICS_POSTGRES_OPERATION_TIMEOUT_SECONDS: '3.0'
  LAB_ANALYTICS_POSTGRES_PROBE_INTERVAL_SECONDS: '2.0'
  LAB_ANALYTICS_POSTGRES_PROBE_TIMEOUT_SECONDS: '1.0'
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 50m
    memory: 96Mi
    ephemeral-storage: 16Mi
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 128Mi
name: analytics-service
resourceName: analytics-service
containerName: analytics-service
includeStandardLabels: false
labels:
  app.kubernetes.io/name: analytics-service
  app.kubernetes.io/part-of: playground
podLabels:
  app.kubernetes.io/part-of: playground
  app.kubernetes.io/component: backend
revisionHistoryLimit: 2
progressDeadlineSeconds: 600
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
automountServiceAccountToken: false
terminationGracePeriodSeconds: 30
imagePullSecrets:
- name: playground-registry
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist
        - key: node-role.kubernetes.io/master
          operator: DoesNotExist
ports:
- name: http
  containerPort: 8002
service:
  enabled: true
  type: ClusterIP
  port: 8002
  targetPort: http
  protocol: TCP
extraVolumes:
- name: tmp
  emptyDir:
    sizeLimit: 32Mi
extraVolumeMounts:
- name: tmp
  mountPath: /tmp
envFrom:
- secretRef:
    name: playground-env
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
