apiVersion: v1
kind: ServiceAccount
metadata:
  name: downloader-sloniara-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: downloader-sloniara-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: downloader-sloniara-bot
    serviceAccount: downloader-sloniara-bot
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: downloader-sloniara-bot-env
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: downloader-sloniara-bot
  mount: kv
  type: kv-v2
  path: apps/downloader-sloniara-bot
  refreshAfter: 1m
  destination:
    create: true
    name: downloader-sloniara-bot-env
    transformation:
      includes:
        - ^(API_ID|API_HASH|PHONE_NUMBER|OPENAI_API_KEY)$
  rolloutRestartTargets:
    - kind: Deployment
      name: downloader-sloniara-bot
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: downloader-sloniara-bot-session
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: downloader-sloniara-bot
  mount: kv
  type: kv-v2
  path: apps/downloader-sloniara-bot
  refreshAfter: 1m
  destination:
    create: true
    name: downloader-sloniara-bot-session
    transformation:
      includes:
        - ^PROD_USER_SESSION_B64$
  rolloutRestartTargets:
    - kind: Deployment
      name: downloader-sloniara-bot
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: downloader-sloniara-bot-cookies
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: downloader-sloniara-bot
  mount: kv
  type: kv-v2
  path: apps/downloader-sloniara-bot
  refreshAfter: 1h
  destination:
    create: true
    name: downloader-sloniara-bot-cookies
    transformation:
      includes:
        - ^(INSTAGRAM_COOKIES_B64|TIKTOK_COOKIES_B64)$
  rolloutRestartTargets:
    - kind: Deployment
      name: downloader-sloniara-bot
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: downloader-sloniara-bot-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: downloader-sloniara-bot
  mount: kv
  type: kv-v2
  path: apps/downloader-sloniara-bot
  refreshAfter: 1h
  destination:
    create: true
    name: downloader-sloniara-bot-registry
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludes:
        - .*
      templates:
        .dockerconfigjson:
          text: |
            {"auths":{"ghcr.io":{"username":"catdevdev","password":"{{ `{{ get .Secrets "GHCR_TOKEN" }}` }}"}}}
  rolloutRestartTargets:
    - kind: Deployment
      name: downloader-sloniara-bot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: downloader-sloniara-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: downloader-sloniara-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: downloader-sloniara-bot
    spec:
      serviceAccountName: downloader-sloniara-bot
      imagePullSecrets:
        - name: downloader-sloniara-bot-registry
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-session
          image: busybox:1.36
          command:
            - sh
            - -ec
            - printf '%s' "$PROD_USER_SESSION_B64" | base64 -d > /session/prod_user.session; chmod 600 /session/prod_user.session
          env:
            - name: PROD_USER_SESSION_B64
              valueFrom:
                secretKeyRef:
                  name: downloader-sloniara-bot-session
                  key: PROD_USER_SESSION_B64
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: session
              mountPath: /session
        - name: seed-cookies
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              printf '%s' "$INSTAGRAM_COOKIES_B64" | base64 -d > /cookies/instagram.txt
              printf '%s' "$TIKTOK_COOKIES_B64" | base64 -d > /cookies/tiktok.txt
              chmod 600 /cookies/*.txt
          env:
            - name: INSTAGRAM_COOKIES_B64
              valueFrom:
                secretKeyRef:
                  name: downloader-sloniara-bot-cookies
                  key: INSTAGRAM_COOKIES_B64
            - name: TIKTOK_COOKIES_B64
              valueFrom:
                secretKeyRef:
                  name: downloader-sloniara-bot-cookies
                  key: TIKTOK_COOKIES_B64
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cookies
              mountPath: /cookies
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: prod
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SESSION_NAME
              value: /app/session/prod_user
            - name: PROXY_DOWNLOADER_TIMEOUT
              value: "120"
            - name: PROXY_AUTO_JOIN_SPONSORS
              value: "true"
            - name: PROXY_DEBUG_LOG
              value: /app/logs/proxy_bot_downloader.log
            - name: SEND_CONTENT_TIMEOUT
              value: "180"
            - name: GALLERY_DL_TIMEOUT
              value: "240"
            - name: INSTAGRAM_COOKIES_PATH
              value: /app/secrets/instagram.txt
            - name: TIKTOK_COOKIES_PATH
              value: /app/secrets/tiktok.txt
          envFrom:
            - secretRef:
                name: downloader-sloniara-bot-env
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: session
              mountPath: /app/session
            - name: logs
              mountPath: /app/logs
            - name: downloads
              mountPath: /app/downloads
            - name: content
              mountPath: /app/content
            - name: cookies
              mountPath: /app/secrets
              readOnly: true
      volumes:
        - name: session
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: downloads
          emptyDir: {}
        - name: content
          emptyDir: {}
        - name: cookies
          emptyDir: {}
