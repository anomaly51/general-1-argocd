# Complete prod-only configuration; there is no shared values.yaml.
_release:
  revision: e87769933b7bec6ad26803d5bdc39cca40148127
  policy: prod-only
  namespace: playground-prod
  sourceRepository: anomaly51/playground-inventory-service

replicaCount: 1
component: backend
appService:
  name: inventory-service
  port: 3004
image:
  repository: harbor.internal.api-api-api.com/playground/inventory-service
  tag: prod@sha256:53f27fb681c3477ad3df41a0e529cd020b573fc1320abcd56f21aa2b81d715be
  pullPolicy: IfNotPresent
serviceAccountName: playground-runtime
imagePullSecret: playground-registry
envSecret: playground-env
probes:
  livenessPath: /healthz
  readinessPath: /readyz
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
resources:
  requests:
    cpu: 50m
    memory: 96Mi
    ephemeral-storage: 16Mi
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 128Mi
scratchVolumes:
  - name: tmp
    mountPath: /tmp
    sizeLimit: 32Mi
env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  HOST: "0.0.0.0"
  PORT: "3004"
  KAFKA_BROKERS: "playground-kafka-kafka-bootstrap:9092"
  KAFKA_CLIENT_ID: "flashdrop-inventory-worker"
  KAFKA_TRACE_TOPIC: "flashdrop.traces.v1"
  MYSQL_POOL_SIZE: "5"
  MYSQL_CONNECTION_TIMEOUT_MS: "5000"
  READINESS_TIMEOUT_MS: "500"
  RABBIT_QUEUE_TYPE: "quorum"
  RABBITMQ_PREFETCH: "10"
  RABBITMQ_MAX_ATTEMPTS: "3"
  RABBITMQ_RETRY_DELAY_MS: "3000"
  PROCESSING_DELAY_MS: "150"
  LAB_INVENTORY_RESET_ENABLED: "false"
