# Complete isolated environment; activated after the first CI release.
_release:
  revision: f786d0cae09f7e93de4c9352543b722eddca8e09
images:
  api:
    repository: harbor.internal.api-api-api.com/applications/job-application-crm-api
    tag: sha-ae78029ee474
    pullPolicy: IfNotPresent
  frontend:
    repository: harbor.internal.api-api-api.com/applications/job-application-crm-frontend
    tag: sha-eb04acbc88dc
    pullPolicy: IfNotPresent
  postgres:
    repository: docker.io/library/postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/job-application-crm/staging/registry
vault:
  mount: kv
  authMount: kubernetes
  role: job-application-crm-staging
  envPath: apps/job-application-crm/staging/env
  refreshAfter: 1m
routes:
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  frontendHostname: job-crm-staging-general1.api-api-api.com
  apiHostname: job-crm-api-staging-general1.api-api-api.com
storage:
  className: nfs-csi
  postgresSize: 2Gi
resources:
  api:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi
  migration:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 192Mi
  frontend:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  postgres:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 384Mi
