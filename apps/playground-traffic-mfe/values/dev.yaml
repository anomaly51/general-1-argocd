# Complete dev configuration; Image Updater tracks its immutable channel digest.
_release:
  revision: 5d94a90dd687b19e3e24f25a6cfdeea292b83137
  policy: promote
  namespace: playground-dev
  sourceRepository: anomaly51/playground-traffic-mfe

replicaCount: 1
nodeSelector:
  kubernetes.io/hostname: general-1-worker-2
component: frontend
appService:
  name: traffic-mfe
  port: 80
image:
  repository: harbor.internal.api-api-api.com/playground/traffic-mfe
  tag: dev@sha256:10f571457f705af9001590e3c5e11daf4fc743be34f6b7bef5ff82be80073efd
  pullPolicy: IfNotPresent
serviceAccountName: playground-runtime
imagePullSecret: playground-registry
envSecret: ""
probes:
  livenessPath: /healthz
  readinessPath: /healthz
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
resources:
  requests:
    cpu: 10m
    memory: 32Mi
    ephemeral-storage: 16Mi
  limits:
    cpu: 100m
    memory: 96Mi
    ephemeral-storage: 192Mi
scratchVolumes:
  - name: tmp
    mountPath: /tmp
    sizeLimit: 32Mi
  - name: nginx-cache
    mountPath: /var/cache/nginx
    sizeLimit: 64Mi
  - name: nginx-run
    mountPath: /var/run
    sizeLimit: 16Mi
# URLs are compiled into these same-origin static assets; no runtime VITE_* override.
env: {}
