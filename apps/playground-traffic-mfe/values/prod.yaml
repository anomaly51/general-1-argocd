_release:
  revision: e87769933b7bec6ad26803d5bdc39cca40148127
  policy: promote
  namespace: playground-prod
  sourceRepository: anomaly51/playground-traffic-mfe
replicaCount: 1
image:
  repository: harbor.internal.api-api-api.com/playground/traffic-mfe
  tag: prod@sha256:10f571457f705af9001590e3c5e11daf4fc743be34f6b7bef5ff82be80073efd
  pullPolicy: IfNotPresent
serviceAccountName: playground-runtime
env: {}
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
    add:
    - CHOWN
    - NET_BIND_SERVICE
    - SETGID
    - SETUID
resources:
  requests:
    cpu: 10m
    memory: 32Mi
    ephemeral-storage: 16Mi
  limits:
    cpu: 100m
    memory: 96Mi
    ephemeral-storage: 192Mi
name: traffic-mfe
resourceName: traffic-mfe
containerName: traffic-mfe
includeStandardLabels: false
labels:
  app.kubernetes.io/name: traffic-mfe
  app.kubernetes.io/part-of: playground
podLabels:
  app.kubernetes.io/part-of: playground
  app.kubernetes.io/component: frontend
revisionHistoryLimit: 2
progressDeadlineSeconds: 600
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
automountServiceAccountToken: false
terminationGracePeriodSeconds: 30
imagePullSecrets:
- name: playground-registry
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist
        - key: node-role.kubernetes.io/master
          operator: DoesNotExist
ports:
- name: http
  containerPort: 80
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: http
  protocol: TCP
extraVolumes:
- name: tmp
  emptyDir:
    sizeLimit: 32Mi
- name: nginx-cache
  emptyDir:
    sizeLimit: 64Mi
- name: nginx-run
  emptyDir:
    sizeLimit: 16Mi
extraVolumeMounts:
- name: tmp
  mountPath: /tmp
- name: nginx-cache
  mountPath: /var/cache/nginx
- name: nginx-run
  mountPath: /var/run
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
