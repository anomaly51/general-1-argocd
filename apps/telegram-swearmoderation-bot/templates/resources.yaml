apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegram-swearmoderation-bot
  labels:
    app.kubernetes.io/name: telegram-swearmoderation-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: telegram-swearmoderation-bot
  labels:
    app.kubernetes.io/name: telegram-swearmoderation-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: telegram-swearmoderation-bot
    serviceAccount: telegram-swearmoderation-bot
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: telegram-swearmoderation-bot-env
  labels:
    app.kubernetes.io/name: telegram-swearmoderation-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: telegram-swearmoderation-bot
  mount: kv
  type: kv-v2
  path: apps/telegram-swearmoderation-bot
  refreshAfter: 1m
  destination:
    create: true
    name: telegram-swearmoderation-bot-env
    transformation:
      includes:
        - ^(BOT_TOKEN|DB_USER|DB_PASS|DB_NAME|ADMIN_ID|SENTRY_DSN)$
  rolloutRestartTargets:
    - kind: Deployment
      name: telegram-swearmoderation-bot
    - kind: StatefulSet
      name: telegram-swearmoderation-bot-postgresql-v2
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: telegram-swearmoderation-bot-registry
  labels:
    app.kubernetes.io/name: telegram-swearmoderation-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: telegram-swearmoderation-bot
  mount: kv
  type: kv-v2
  path: apps/registry
  refreshAfter: 1h
  destination:
    create: true
    name: telegram-swearmoderation-bot-registry
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludes:
        - .*
      templates:
        .dockerconfigjson:
          text: |
            {"auths":{"harbor.internal.api-api-api.com":{"username":"{{ `{{ get .Secrets "username" }}` }}","password":"{{ `{{ get .Secrets "password" }}` }}"}}}
  rolloutRestartTargets:
    - kind: Deployment
      name: telegram-swearmoderation-bot
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-swearmoderation-bot-postgresql-v2
  labels:
    app.kubernetes.io/name: telegram-swearmoderation-bot
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/instance-generation: "v2"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: telegram-swearmoderation-bot
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/instance-generation: "v2"
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-swearmoderation-bot-metrics
  labels:
    app.kubernetes.io/name: telegram-swearmoderation-bot
    app.kubernetes.io/component: bot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telegram-swearmoderation-bot
    app.kubernetes.io/component: bot
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
      protocol: TCP
      appProtocol: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telegram-swearmoderation-bot-postgresql-v2
  labels:
    app.kubernetes.io/name: telegram-swearmoderation-bot
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/instance-generation: "v2"
spec:
  serviceName: telegram-swearmoderation-bot-postgresql-v2
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-swearmoderation-bot
      app.kubernetes.io/component: postgresql
      app.kubernetes.io/instance-generation: "v2"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-swearmoderation-bot
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/instance-generation: "v2"
    spec:
      serviceAccountName: telegram-swearmoderation-bot
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: telegram-swearmoderation-bot-env
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telegram-swearmoderation-bot-env
                  key: DB_PASS
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: telegram-swearmoderation-bot-env
                  key: DB_NAME
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
        labels:
          app.kubernetes.io/name: telegram-swearmoderation-bot
          app.kubernetes.io/component: postgresql
          app.kubernetes.io/instance-generation: "v2"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.postgresql.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-swearmoderation-bot
  labels:
    app.kubernetes.io/name: telegram-swearmoderation-bot
    app.kubernetes.io/component: bot
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-swearmoderation-bot
      app.kubernetes.io/component: bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-swearmoderation-bot
        app.kubernetes.io/component: bot
    spec:
      serviceAccountName: telegram-swearmoderation-bot
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      imagePullSecrets:
        - name: telegram-swearmoderation-bot-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - until pg_isready -h telegram-swearmoderation-bot-postgresql-v2 -p 5432 -U postgres -d postgres; do sleep 2; done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DB_HOST
              value: telegram-swearmoderation-bot-postgresql-v2
            - name: DB_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: telegram-swearmoderation-bot-env
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 20
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
