apiVersion: v1
kind: Service
metadata:
  name: keycloak-nodeport
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
  selector:
    app.kubernetes.io/name: keycloakx
    app.kubernetes.io/instance: {{ .Release.Name }}
