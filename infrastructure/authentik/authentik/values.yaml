authentik:
  authentik:
    existingSecret:
      secretName: authentik-credentials

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-credentials
      secretKeys:
        userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
        adminPasswordKey: POSTGRES_ADMIN_PASSWORD
    primary:
      persistence:
        enabled: true
        storageClass: local-path
        size: 2Gi

  # Cluster-wide permissions are only needed for managed outposts.
  serviceAccount:
    create: false

