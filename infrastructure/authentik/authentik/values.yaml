authentik:
  authentik:
    existingSecret:
      secretName: authentik-secrets

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-secrets
      secretKeys:
        userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
        adminPasswordKey: POSTGRES_ADMIN_PASSWORD
    primary:
      persistence:
        enabled: true
        storageClass: local-path
        size: 2Gi

  # Cluster-wide permissions are only needed for managed outposts.
  serviceAccount:
    create: false

vaultSecrets:
  enabled: true
  secrets:
    - name: authentik
      destinationName: authentik-secrets
      rolloutRestartTargets:
        - kind: Deployment
          name: authentik-server
        - kind: Deployment
          name: authentik-worker
