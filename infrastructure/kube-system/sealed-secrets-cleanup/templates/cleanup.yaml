apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-cleanup
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-cleanup
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - sealedsecrets.bitnami.com
    verbs:
      - delete
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - sealed-secrets-keysbv2c
    verbs:
      - delete
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sealed-secrets-cleanup
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-cleanup
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sealed-secrets-cleanup
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: sealed-secrets-cleanup
      restartPolicy: OnFailure
      containers:
        - name: signing-key
          image: registry.k8s.io/kubectl:v1.35.4
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
          args:
            - delete
            - secret
            - sealed-secrets-keysbv2c
            - --namespace=kube-system
            - --ignore-not-found=true
            - --wait=false
        - name: crd
          image: registry.k8s.io/kubectl:v1.35.4
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
          args:
            - delete
            - customresourcedefinition
            - sealedsecrets.bitnami.com
            - --ignore-not-found=true
            - --wait=false
