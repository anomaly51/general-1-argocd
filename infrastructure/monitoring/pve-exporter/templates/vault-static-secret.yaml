{{- $secretName := required "existingSecret must name the PVE credentials Secret" .Values.existingSecret -}}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}
spec:
  vaultAuthRef: monitoring
  mount: kv
  type: kv-v2
  path: monitoring/pve-exporter
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    name: {{ $secretName }}
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
