{{- $secretName := required "existingSecret must name the PVE credentials Secret" .Values.existingSecret -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-pve-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: pve-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: monitoring-pve-exporter
    serviceAccount: vso-pve-exporter
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}
spec:
  vaultAuthRef: pve-exporter
  mount: kv
  type: kv-v2
  path: monitoring/pve-exporter
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    name: {{ $secretName }}
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
