{{- $secretName := required "grafana.admin.existingSecret must name the Grafana admin Secret" .Values.grafana.admin.existingSecret -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    vault.hashicorp.com/alias-metadata-secret_name: grafana-admin
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # VSO resolves the operator-owned vault-system/VaultConnection/default.
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: monitoring-grafana
    serviceAccount: vso-grafana
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}
spec:
  vaultAuthRef: grafana
  mount: kv
  type: kv-v2
  path: monitoring/grafana-admin
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: {{ $secretName }}
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
