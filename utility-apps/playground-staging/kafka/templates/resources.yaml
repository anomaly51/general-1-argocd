apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    strimzi.io/cluster: {{ .Values.name }}
  {{- if not .Values.ephemeral }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  {{- end }}
spec:
  replicas: 1
  roles: [controller, broker]
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  storage:
    type: persistent-claim
    size: {{ .Values.storage.size }}
    class: {{ .Values.storage.className }}
    deleteClaim: {{ .Values.ephemeral }}
  template:
    {{- if not .Values.ephemeral }}
    persistentVolumeClaim:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
    {{- end }}
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [{{ required "storage.nodeName is required for local-path placement" .Values.storage.nodeName | quote }}]
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.name }}
  {{- if not .Values.ephemeral }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  {{- end }}
spec:
  kafka:
    version: {{ .Values.version | quote }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
    config:
      auto.create.topics.enable: false
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      num.partitions: 3
      log.retention.hours: 24
      log.segment.bytes: 134217728
  entityOperator:
    topicOperator:
      watchedNamespace: {{ .Release.Namespace }}
      jvmOptions:
        -Xms: 64m
        -Xmx: 128m
      resources:
        {{- toYaml .Values.topicOperatorResources | nindent 8 }}
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [general-1-worker-2]
{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name | replace "." "-" }}
  labels:
    strimzi.io/cluster: {{ $.Values.name }}
  annotations:
    {{- if $.Values.ephemeral }}
    # Delete topics while their broker and topic operator still exist.
    argocd.argoproj.io/sync-wave: "1"
    {{- else }}
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    {{- end }}
spec:
  topicName: {{ .name }}
  partitions: {{ .partitions }}
  replicas: 1
  config:
    retention.ms: {{ .retentionMs | int64 }}
    min.insync.replicas: 1
{{- end }}
