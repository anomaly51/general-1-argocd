apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: {{ .Values.vault.authMount }}
  kubernetes:
    role: {{ .Values.vault.role }}
    serviceAccount: rabbitmq-secrets
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: shared-default-user
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: rabbitmq
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.path }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    create: true
    overwrite: true
    name: shared-default-user
    labels:
      app.kubernetes.io/part-of: rabbitmq
      rabbitmq.com/topology-operator: "true"
    transformation:
      excludes:
        - .*
      templates:
        default_user.conf:
          text: |
            default_user = {{ `{{ get .Secrets "username" }}` }}
            default_pass = {{ `{{ get .Secrets "password" }}` }}
        host:
          text: {{ .Values.cluster.name }}.rabbitmq-system.svc.cluster.local
        username:
          text: '{{ `{{- get .Secrets "username" -}}` }}'
        password:
          text: '{{ `{{- get .Secrets "password" -}}` }}'
        port:
          text: "5672"
        provider:
          text: rabbitmq
        type:
          text: rabbitmq
