strimzi-kafka-operator:
  replicas: 1
  # A second non-leader stays unready, so single-replica moves must not use surge rollout.
  deploymentStrategy:
    type: Recreate
  watchAnyNamespace: true
  fullReconciliationIntervalMs: 300000
  operationTimeoutMs: 300000
  generateNetworkPolicy: true
  generatePodDisruptionBudget: false
  extraEnvs:
    - name: JAVA_OPTS
      value: -Xms128m -Xmx256m
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    # Keep the memory-constrained Kubernetes API node free for control-plane work.
    kubernetes.io/hostname: general-1-worker-3
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
