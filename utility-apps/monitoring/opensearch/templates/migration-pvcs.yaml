# Adopt the unused first-attempt claims so Argo CD can prune them after migration.
{{- range $ordinal := until 3 }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-opensearch-logs-nodes-{{ $ordinal }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
{{- end }}
