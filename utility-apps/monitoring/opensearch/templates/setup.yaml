apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-setup
data:
  setup.py: |
{{ .Files.Get "setup.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels: {app: opensearch-setup}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: general-1-worker-2
      containers:
        - name: setup
          image: python:3.13-alpine
          command: [python, /setup/setup.py]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: ca, mountPath: /certs, readOnly: true}
      volumes:
        - name: setup
          configMap: {name: opensearch-setup}
        - name: credentials
          secret: {secretName: opensearch-admin}
        - name: ca
          secret:
            secretName: logging-ca
            items:
              - {key: tls.crt, path: ca.crt}
