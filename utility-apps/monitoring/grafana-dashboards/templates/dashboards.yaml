{{- range $path, $_ := .Files.Glob "dashboards/*/*.json" }}
{{- $folder := base (dir $path) }}
{{- $dashboard := trimSuffix ".json" (base $path) }}
{{- $name := regexReplaceAll "[^a-z0-9-]+" (printf "%s-%s" $folder $dashboard | lower) "-" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "grafana-dashboard-%s" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    k8s-sidecar-target-directory: {{ $folder | quote }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | nindent 4 }}
---
{{- end }}
