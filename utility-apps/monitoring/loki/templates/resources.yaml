apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: loki-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: monitoring
  mount: kv
  type: kv-v2
  path: monitoring/loki
  refreshAfter: 1m
  destination:
    create: true
    name: loki-s3
  rolloutRestartTargets:
    - kind: StatefulSet
      name: loki
---
# Loki is single-tenant and reachable only by monitoring workloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {port: 3100, protocol: TCP}
        - {port: 9095, protocol: TCP}
        - {port: 7946, protocol: TCP}
