loki:
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2026-10-17"
          store: tsdb
          object_store: s3
          schema: v13
          index: {prefix: loki_index_, period: 24h}
    storage:
      bucketNames: {chunks: general1-loki, ruler: general1-loki}
      s3:
        endpoint: minio.minio-system.svc.cluster.local:9000
        region: us-east-1
        accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
        secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
        s3ForcePathStyle: true
        insecure: true
    limits_config:
      retention_period: 168h
      allow_structured_metadata: true
      otlp_config:
        resource_attributes:
          ignore_defaults: true
          attributes_config:
            - action: index_label
              attributes: [service.name, k8s.cluster.name, k8s.namespace.name, k8s.container.name, log.source]
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3
  singleBinary:
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: general-1-worker-2
    extraArgs: [-config.expand-env=true]
    extraEnvFrom:
      - secretRef: {name: loki-s3}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    persistence:
      storageClass: local-path
      size: 10Gi
  backend: {replicas: 0}
  read: {replicas: 0}
  write: {replicas: 0}
  gateway: {enabled: false}
  chunksCache: {enabled: false}
  resultsCache: {enabled: false}
  memcached: {enabled: false}
  lokiCanary: {enabled: false}
  test: {enabled: false}
  rbac: {namespaced: true}
  serviceAccount:
    automountServiceAccountToken: false
  sidecar:
    rules: {enabled: false}
