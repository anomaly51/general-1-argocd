csi-driver-nfs:
  controller:
    enableSnapshotter: false
    # Keep the storage control plane away from the single k3s/etcd node.
    # This worker has enough requested-memory headroom for the 80 MiB controller.
    nodeSelector:
      kubernetes.io/hostname: general-1-worker-3

  storageClass:
    create: false

  storageClasses:
    - name: nfs-csi
      parameters:
        server: 192.168.1.9
        share: /export/test
        subDir: "${pvc.metadata.namespace}/${pvc.metadata.name}"
        mountPermissions: "0777"
        onDelete: retain
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
