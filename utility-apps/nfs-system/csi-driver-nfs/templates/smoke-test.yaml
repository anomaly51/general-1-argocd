apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-csi-smoke
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi-smoke
  resources:
    requests:
      storage: 1Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nfs-csi-smoke
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-csi-smoke
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke-test
          image: docker.io/library/busybox:1.37.0
          command:
            - /bin/sh
            - -ec
          args:
            - echo nfs-csi-ok > /data/result && test "$(cat /data/result)" = nfs-csi-ok
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nfs-csi-smoke
