# Partial SSA intent only: bootstrap retains all fields not declared here.
# ApplicationSet disables CSA field migration for this exact utility chart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Validate=false,Prune=false,Delete=false
spec:
  template:
    spec:
      nodeSelector:
        # nodeSelector is an atomic SSA map; retain the bootstrap Linux selector.
        kubernetes.io/os: linux
        kubernetes.io/hostname: {{ .Values.nodeName }}
      containers:
        - name: argocd-application-controller
          resources:
            requests:
              {{- toYaml .Values.requests | nindent 14 }}
