worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    # No credential-bearing headers, bodies or query strings in access logs.
    log_format webhook '$time_iso8601 $request_method $uri $status $request_time';
    access_log /dev/stdout webhook;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 10s;
    server_tokens off;
    # Variable paths reload projected cert-manager certificates on each handshake.
    # Never interpolate user input into a filesystem path.
    map $ssl_server_name $certificate_directory { default /tls; }
    server {
        listen 8444 ssl;
        ssl_certificate $certificate_directory/tls.crt;
        ssl_certificate_key $certificate_directory/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        location = /healthz { access_log off; return 200 'ok'; }
        location = /webhook {
            limit_except POST { deny all; }
            proxy_set_header X-Registry-Type harbor;
            proxy_set_header Authorization $http_authorization;
            # Strip any caller query so it cannot override the forced type header.
            set $args "";
            proxy_pass http://127.0.0.1:8082/webhook;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_buffering off;
        }
        location / { return 404; }
    }
}
