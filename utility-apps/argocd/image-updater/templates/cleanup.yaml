# Argo CD v3.4.5 creates PostDelete hooks after the application's normal resources
# are gone, and retains all HookSucceeded resources until every hook is healthy.
# Keep this chart path in Git during Application deletion: hooks are read from Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playground-image-updater-cleanup
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: playground-image-updater-cleanup
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [playground-image-updater-controller]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [c21b75f2.argoproj.io]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: playground-image-updater-cleanup
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: playground-image-updater-cleanup
subjects:
  - kind: ServiceAccount
    name: playground-image-updater-cleanup
    namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: playground-image-updater-cleanup
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playground-image-updater-cleanup
    spec:
      serviceAccountName: playground-image-updater-cleanup
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cleanup
          image: {{ .Values.cleanup.image }}
          command: [python, -B, -c]
          args:
            - |
              import json
              from pathlib import Path
              import ssl
              import time
              import urllib.error
              import urllib.request

              BASE = "https://kubernetes.default.svc"
              DEPLOYMENT = "/apis/apps/v1/namespaces/argocd/deployments/playground-image-updater-controller"
              LEASE = "/apis/coordination.k8s.io/v1/namespaces/argocd/leases/c21b75f2.argoproj.io"
              EXPECTED_UID = {{ .Values.cleanup.leaseUID | quote }}
              EXPECTED_HOLDER = {{ .Values.cleanup.leaseHolderIdentity | quote }}
              SERVICE_ACCOUNT = Path("/var/run/secrets/kubernetes.io/serviceaccount")

              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None

              opener = urllib.request.build_opener(
                  urllib.request.HTTPSHandler(context=ssl.create_default_context(
                      cafile=str(SERVICE_ACCOUNT / "ca.crt"))), NoRedirect())

              def request(method, path, payload=None):
                  if (method, path) not in {("GET", DEPLOYMENT), ("GET", LEASE), ("DELETE", LEASE)}:
                      raise ValueError("Out-of-scope cleanup request")
                  req = urllib.request.Request(
                      BASE + path, method=method,
                      data=None if payload is None else json.dumps(payload).encode(),
                      headers={"Authorization": "Bearer " + (SERVICE_ACCOUNT / "token").read_text().strip(),
                               "Content-Type": "application/json", "Accept": "application/json"})
                  try:
                      with opener.open(req, timeout=10) as response:
                          body = response.read()
                          return json.loads(body) if body else None
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return None
                      raise

              def cleanup():
                  if request("GET", DEPLOYMENT) is not None:
                      raise ValueError("Controller still exists; refusing lease deletion")
                  lease = request("GET", LEASE)
                  if lease is None:
                      return
                  metadata = lease.get("metadata", {})
                  holder = lease.get("spec", {}).get("holderIdentity", "")
                  if (metadata.get("name") != "c21b75f2.argoproj.io"
                          or metadata.get("namespace") != "argocd"
                          or metadata.get("uid") != EXPECTED_UID
                          or not metadata.get("resourceVersion")
                          or holder != EXPECTED_HOLDER):
                      raise ValueError("Unexpected lease ownership; refusing deletion")
                  request("DELETE", LEASE, {
                      "apiVersion": "v1", "kind": "DeleteOptions",
                      "preconditions": {"uid": metadata["uid"],
                                        "resourceVersion": metadata["resourceVersion"]}})
                  if request("GET", LEASE) is not None:
                      raise ValueError("Retired lease still exists")

              # PostDelete hooks are created unordered; allow SA/RBAC propagation.
              try:
                  for attempt in range(12):
                      try:
                          cleanup()
                          break
                      except urllib.error.HTTPError as error:
                          if error.code not in {401, 403} or attempt == 11:
                              raise
                          time.sleep(3)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Lease cleanup failed: HTTP {error.code}") from None
              except Exception as error:
                  raise SystemExit(f"Lease cleanup failed: {type(error).__name__}") from None
              print("Retired Image Updater leader lease absent", flush=True)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
