apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: playground-image-updater-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: playground-image-updater-webhook-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - {{ .Values.webhook.hostname | quote }}
  privateKey:
    rotationPolicy: Always
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: playground-image-updater-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: playground-image-updater
  mount: kv
  type: kv-v2
  path: {{ .Values.webhook.vaultPath }}
  refreshAfter: 1m
  destination:
    create: true
    name: argocd-image-updater-secret
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        webhook.harbor-secret:
          text: '{{ `{{- get .Secrets "secret" -}}` }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: playground-image-updater-controller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: playground-image-updater-webhook
  namespace: argocd
data:
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: playground-image-updater-webhook
  namespace: argocd
spec:
  type: ClusterIP
  clusterIP: {{ .Values.webhook.clusterIP }}
  selector:
    app.kubernetes.io/name: argocd-image-updater
    app.kubernetes.io/instance: image-updater
  ports:
    - name: https
      port: 443
      targetPort: webhook-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: playground-image-updater-webhook
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-image-updater
      app.kubernetes.io/instance: image-updater
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: harbor
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [core, jobservice]
      ports:
        - {protocol: TCP, port: 8444}
