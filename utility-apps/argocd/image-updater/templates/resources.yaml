apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: playground-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: playground-image-updater
    serviceAccount: playground-image-updater
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: playground-image-updater-registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: playground-image-updater
  mount: kv
  type: kv-v2
  path: apps/playground-prod/registry
  refreshAfter: 1h
  destination:
    create: true
    name: playground-image-updater-registry
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        .dockerconfigjson:
          text: |
            {{ `{{- $username := get .Secrets "username" -}}` }}
            {{ `{{- $password := get .Secrets "password" -}}` }}
            {{ `{{- $credentials := dict "username" $username "password" $password "auth" (printf "%s:%s" $username $password | b64enc) -}}` }}
            {{ `{{- dict "auths" (dict "harbor.internal.api-api-api.com" $credentials) | mustToJson -}}` }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: playground-image-updater-git
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: playground-image-updater
  mount: kv
  type: kv-v2
  path: ci/github-app
  refreshAfter: 1h
  destination:
    create: true
    name: playground-image-updater-git
    type: Opaque
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        githubAppID:
          text: '{{ `{{- get .Secrets "app_id" -}}` }}'
        githubAppInstallationID:
          text: '{{ `{{- get .Secrets "installation_id" -}}` }}'
        githubAppPrivateKey:
          text: '{{ `{{- get .Secrets "private_key" -}}` }}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: playground-image-updater-git-only
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [argocd-image-updater.argoproj.io]
    resources: [imageupdaters]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [argocd-image-updater.argoproj.io]
    resources: [imageupdaters/finalizers]
    verbs: [update]
  - apiGroups: [argocd-image-updater.argoproj.io]
    resources: [imageupdaters/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: playground-image-updater-git-only
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: playground-image-updater-git-only
subjects:
  - kind: ServiceAccount
    name: playground-image-updater
    namespace: argocd
{{- range $environment := .Values.environments }}
{{- if not (has $environment (list "dev" "staging")) }}
{{- fail "Image Updater may only manage dev and staging" }}
{{- end }}
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: playground-{{ $environment }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  applicationRefs:
    {{- range $.Values.applications }}
    - namePattern: playground-{{ . }}-{{ $environment }}
      useAnnotations: false
      images:
        - alias: {{ . }}
          imageName: harbor.internal.api-api-api.com/playground/{{ . }}:{{ $environment }}
          commonUpdateSettings:
            updateStrategy: digest
            platforms: [linux/amd64]
            pullSecret: pullsecret:argocd/playground-image-updater-registry
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
      writeBackConfig:
        method: git:secret:playground-image-updater-git
        gitConfig:
          repository: https://github.com/anomaly51/general-1-argocd.git
          branch: main
          writeBackTarget: helmvalues:/apps/playground-{{ . }}/values/{{ $environment }}.yaml
    {{- end }}
{{- end }}
