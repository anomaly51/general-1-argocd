apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: argocd-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: argocd-webhook
    serviceAccount: argocd-webhook
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-github-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: argocd-webhook
  mount: kv
  type: kv-v2
  path: {{ .Values.vaultPath }}
  refreshAfter: 1m
  destination:
    create: true
    name: argocd-github-webhook
    transformation:
      excludeRaw: true
      includes: ["^secret$"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [argocd-secret]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [argocd-applicationset-controller]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-webhook
subjects:
  - kind: ServiceAccount
    name: argocd-webhook
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-webhook-configure
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  configure.py: |
{{ .Files.Get "files/configure.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-webhook-configure
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: argocd-webhook
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: {{ .Values.image }}
          command: [python, -B, /scripts/configure.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: secret
              mountPath: /webhook
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: argocd-webhook-configure
        - name: secret
          secret:
            secretName: argocd-github-webhook
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-webhook
  annotations:
    # Publish the listener only after its signed-webhook configuration is loaded.
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: public
      namespace: networking
      sectionName: https
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /api/webhook
      backendRefs:
        - name: argocd-applicationset-controller
          port: 7000
