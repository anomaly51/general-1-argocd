{{- define "hermes.config" -}}
model:
  provider: openai-codex
  default: gpt-6.1-sol
database:
  journal_mode: delete
terminal:
  backend: local
  cwd: /opt/data/workspace
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: hermes
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: hermes
    serviceAccount: vault-secrets
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hermes
spec:
  vaultAuthRef: hermes
  mount: kv
  type: kv-v2
  path: apps/hermes
  refreshAfter: 1m
  destination:
    create: true
    name: hermes
    transformation:
      excludeRaw: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml: |
{{ include "hermes.config" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: hermes}
  template:
    metadata:
      labels: {app: hermes}
      annotations:
        checksum/config: {{ include "hermes.config" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: config
          image: busybox:1.37.0
          command: [sh, -ec]
          args:
            - |
              cp /config/config.yaml /data/config.yaml
              chown 10000:10000 /data /data/config.yaml
              chmod 700 /data
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
          args: [gateway, run]
          env:
            - {name: TZ, value: Europe/Kyiv}
            - {name: API_SERVER_ENABLED, value: "true"}
            - {name: API_SERVER_HOST, value: "0.0.0.0"}
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef: {name: hermes, key: API_SERVER_KEY}
          ports:
            - {name: api, containerPort: 8642}
          startupProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi, ephemeral-storage: 256Mi}
            limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /opt/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: hermes-data}
        - name: config
          configMap: {name: hermes-config}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
spec:
  selector: {app: hermes}
  ports:
    - {name: api, port: 8642, targetPort: api}
