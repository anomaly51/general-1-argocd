{{- define "hermes.config" -}}
model:
  provider: openai-codex
  default: gpt-6.1-sol
database:
  journal_mode: delete
platforms:
  telegram:
    extra:
      dm_policy: allowlist
      group_policy: disabled
terminal:
  backend: local
  cwd: /opt/data/workspace
platform_toolsets:
  api_server: [interviews_tracker]
mcp_servers:
  gmail:
    command: /opt/hermes/.venv/bin/python
    args: [/opt/gmail/gmail_mcp.py]
  interviews_tracker:
    url: https://interviews-tracker.api-api-api.com/auth/mcp/
    transport: streamable-http
    strict_redirect_headers: true
    headers:
      Authorization: "Bearer ${INTERVIEWS_TRACKER_MCP_TOKEN}"
    tools:
      include: [get_tracker_info, list_vacancies, get_vacancy]
{{- if .Values.windowsPc.enabled }}
  windows_pc:
    command: /usr/bin/ssh
    args: [-F, /opt/windows-pc-ssh/config, -T, hermes-windows-pc, 'cua-driver.exe mcp --socket \\.\pipe\cua-driver']
    connect_timeout: 8
    tools:
      include: [list_apps, list_windows, get_window_state, get_desktop_state, launch_app, click, type_text, press_key, scroll, drag]
      resources: false
      prompts: false
  windows_codex:
    command: /usr/bin/ssh
    args: [-F, /opt/windows-pc-ssh/config, -T, hermes-windows-pc, 'codex mcp-server']
    connect_timeout: 8
    tools:
      include: [codex, codex-reply]
      resources: false
      prompts: false
plugins:
  enabled: [windows-pc]
{{- end }}
webapp:
  enabled: true
  host: 127.0.0.1
  port: 9120
  public_url: https://hermes.internal.api-api-api.com
{{- end -}}
{{- define "hermes.proxy" -}}
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Public OAuth information only. No proxy, secret files or agent routes.
  server {
    listen 8081;
    server_name hermes-mail.api-api-api.com;
    if ($host != hermes-mail.api-api-api.com) { return 403; }
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
    location = / { default_type text/html; root /template; try_files /mail-info.html =404; }
    location / { return 404; }
  }
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  # The LAN is the access boundary. Refuse requests from unrelated web pages.
  map $http_origin $origin_allowed {
    default 0;
    "" 1;
    "https://hermes.internal.api-api-api.com" 1;
  }
  map "$http_sec_fetch_site:$http_sec_fetch_mode:$request_method" $fetch_allowed {
    default 1;
    "cross-site:navigate:GET" 1;
    ~^cross-site: 0;
  }
  server {
    listen 8080;
    server_name hermes.internal.api-api-api.com;
    client_max_body_size 32m;
    if ($host != hermes.internal.api-api-api.com) { return 403; }
    if ($origin_allowed = 0) { return 403; }
    if ($fetch_allowed = 0) { return 403; }
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
{{- if .Values.windowsPc.enabled }}
    auth_basic "Hermes";
    auth_basic_user_file /run/hermes-web-auth/htpasswd;
    location = /_ready {
      auth_basic off;
      return 204;
    }
{{- end }}
    location / {
      proxy_pass http://127.0.0.1:9120;
      proxy_http_version 1.1;
      proxy_set_header Host hermes.internal.api-api-api.com;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization "Bearer ${HERMES_DASHBOARD_SESSION_TOKEN}";
      proxy_set_header X-Hermes-Session-Token "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: hermes
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: hermes
    serviceAccount: vault-secrets
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hermes
spec:
  vaultAuthRef: hermes
  mount: kv
  type: kv-v2
  path: apps/hermes
  refreshAfter: 1m
  rolloutRestartTargets:
    - {kind: Deployment, name: hermes}
  destination:
    create: true
    name: hermes
    transformation:
      excludeRaw: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml: |
{{ include "hermes.config" . | indent 4 }}
  nginx.conf: |
{{ include "hermes.proxy" . | indent 4 }}
  gmail_mcp.py: |
{{ .Files.Get "files/gmail_mcp.py" | indent 4 }}
  mail-info.html: |
{{ .Files.Get "files/mail-info.html" | indent 4 }}
{{- if .Values.windowsPc.enabled }}
  windows-plugin-yaml: |
{{ .Files.Get "files/windows-pc/plugin.yaml" | indent 4 }}
  windows-plugin-manifest: |
{{ .Files.Get "files/windows-pc/manifest.json" | indent 4 }}
  windows-plugin-api: |
{{ .Files.Get "files/windows-pc/plugin_api.py" | indent 4 }}
  windows-plugin-ui: |
{{ .Files.Get "files/windows-pc/plugin.js" | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: hermes}
  template:
    metadata:
      labels: {app: hermes}
      annotations:
        checksum/config: {{ include "hermes.config" . | sha256sum }}
        checksum/proxy: {{ include "hermes.proxy" . | sha256sum }}
        checksum/gmail: {{ .Files.Get "files/gmail_mcp.py" | sha256sum }}
{{- if .Values.windowsPc.enabled }}
        checksum/windows-pc: {{ printf "%s%s%s%s" (.Files.Get "files/windows-pc/plugin.yaml") (.Files.Get "files/windows-pc/manifest.json") (.Files.Get "files/windows-pc/plugin_api.py") (.Files.Get "files/windows-pc/plugin.js") | sha256sum }}
{{- end }}
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: config
          image: busybox:1.37.0
          command: [sh, -ec]
          args:
            - |
              cp /config/config.yaml /data/config.yaml
              chown 10000:10000 /data /data/config.yaml
              chmod 700 /data
{{- if .Values.windowsPc.enabled }}
              umask 077
              cp /windows-pc-source/config /windows-pc-source/key /windows-pc-source/known_hosts /windows-pc-ssh/
              chown 10000:10000 /windows-pc-ssh/config /windows-pc-ssh/key /windows-pc-ssh/known_hosts
              chmod 600 /windows-pc-ssh/config /windows-pc-ssh/key /windows-pc-ssh/known_hosts
{{- end }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /data}
{{- if .Values.windowsPc.enabled }}
            - {name: windows-pc-source, mountPath: /windows-pc-source, readOnly: true}
            - {name: windows-pc-ssh, mountPath: /windows-pc-ssh}
{{- end }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
          args: [gateway, run]
          env:
            - {name: TZ, value: Europe/Kyiv}
            - {name: API_SERVER_ENABLED, value: "true"}
            - {name: API_SERVER_HOST, value: "0.0.0.0"}
            - name: HERMES_DASHBOARD_SESSION_TOKEN
              valueFrom:
                secretKeyRef: {name: hermes, key: HERMES_DASHBOARD_SESSION_TOKEN}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: hermes, key: TELEGRAM_BOT_TOKEN}
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef: {name: hermes, key: TELEGRAM_ALLOWED_USERS}
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef: {name: hermes, key: API_SERVER_KEY}
            - name: INTERVIEWS_TRACKER_MCP_TOKEN
              valueFrom:
                secretKeyRef: {name: hermes, key: INTERVIEWS_TRACKER_MCP_TOKEN, optional: true}
          ports:
            - {name: api, containerPort: 8642}
          startupProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi, ephemeral-storage: 256Mi}
            limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /opt/data}
            - {name: config, mountPath: /opt/gmail, readOnly: true}
            - {name: gmail-secrets, mountPath: /opt/gmail-secrets, readOnly: true}
{{- if .Values.windowsPc.enabled }}
            - {name: windows-pc-ssh, mountPath: /opt/windows-pc-ssh, readOnly: true}
            - {name: windows-pc-plugin, mountPath: /opt/data/plugins/windows-pc, readOnly: true}
            - {name: windows-pc-ui, mountPath: /opt/data/desktop-plugins/windows-pc, readOnly: true}
{{- end }}
        - name: lan-web
          image: nginx:stable-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
          command: [sh, -ec]
          args:
            - |
              umask 077
              envsubst '${HERMES_DASHBOARD_SESSION_TOKEN}' < /template/nginx.conf > /tmp/nginx.conf
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          env:
            - name: HERMES_DASHBOARD_SESSION_TOKEN
              valueFrom:
                secretKeyRef: {name: hermes, key: HERMES_DASHBOARD_SESSION_TOKEN}
          ports:
            - {name: web, containerPort: 8080}
            - {name: mail-info, containerPort: 8081}
          readinessProbe:
            httpGet:
              path: {{ ternary "/_ready" "/api/status" .Values.windowsPc.enabled }}
              port: web
              httpHeaders:
                - {name: Host, value: hermes.internal.api-api-api.com}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /template, readOnly: true}
            - {name: proxy-tmp, mountPath: /tmp}
{{- if .Values.windowsPc.enabled }}
            - {name: windows-pc-web-auth, mountPath: /run/hermes-web-auth, readOnly: true}
{{- end }}
      volumes:
        - name: gmail-secrets
          secret:
            secretName: hermes
            optional: true
            items:
              - {key: GMAIL_CREDENTIALS_JSON, path: credentials.json}
        - name: proxy-tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        - name: data
          persistentVolumeClaim: {claimName: hermes-data}
        - name: config
          configMap: {name: hermes-config}
{{- if .Values.windowsPc.enabled }}
        - name: windows-pc-source
          secret:
            secretName: hermes
            defaultMode: 0400
            items:
              - {key: WINDOWS_PC_SSH_CONFIG, path: config}
              - {key: WINDOWS_PC_SSH_KEY, path: key}
              - {key: WINDOWS_PC_KNOWN_HOSTS, path: known_hosts}
        - name: windows-pc-ssh
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: windows-pc-web-auth
          secret:
            secretName: hermes
            items:
              - {key: WINDOWS_PC_WEB_HTPASSWD, path: htpasswd}
        - name: windows-pc-plugin
          configMap:
            name: hermes-config
            items:
              - {key: windows-plugin-yaml, path: plugin.yaml}
              - {key: windows-plugin-manifest, path: dashboard/manifest.json}
              - {key: windows-plugin-api, path: dashboard/plugin_api.py}
        - name: windows-pc-ui
          configMap:
            name: hermes-config
            items:
              - {key: windows-plugin-ui, path: plugin.js}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
spec:
  selector: {app: hermes}
  ports:
    - {name: api, port: 8642, targetPort: api}
    - {name: web, port: 9120, targetPort: web}
    - {name: mail-info, port: 8081, targetPort: mail-info}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes
spec:
  podSelector:
    matchLabels: {app: hermes}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 8642}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
spec:
  parentRefs:
    - {name: internal, namespace: networking, sectionName: https}
  hostnames: [hermes.internal.api-api-api.com]
  rules:
    - backendRefs:
        - {name: hermes, port: 9120}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-mail-info
spec:
  parentRefs:
    - {name: public, namespace: networking, sectionName: https}
  hostnames: [hermes-mail.api-api-api.com]
  rules:
    - backendRefs:
        - {name: hermes, port: 8081}
