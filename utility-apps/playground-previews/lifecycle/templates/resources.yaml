apiVersion: v1
kind: ServiceAccount
metadata:
  name: playground-preview-lifecycle
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: playground-preview-lifecycle
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: playground-preview-lifecycle
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: playground-preview-lifecycle
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: playground-preview-lifecycle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: playground-preview-lifecycle
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: playground-preview-lifecycle
subjects:
  - kind: ServiceAccount
    name: playground-preview-lifecycle
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: playground-preview-lifecycle
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: playground-preview-lifecycle
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ .Values.vaultRole }}
    serviceAccount: playground-preview-lifecycle
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: playground-preview-github-app
spec:
  vaultAuthRef: playground-preview-lifecycle
  mount: kv
  type: kv-v2
  path: {{ .Values.githubAppPath }}
  refreshAfter: 1m
  destination:
    create: true
    name: playground-preview-github-app
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        app_id:
          text: '{{ `{{ get .Secrets "app_id" }}` }}'
        private_key:
          text: '{{ `{{ get .Secrets "private_key" }}` }}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: playground-preview-lifecycle
data:
  lifecycle.py: |
{{ .Files.Get "files/lifecycle.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: playground-preview-lifecycle
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 110
      backoffLimit: 0
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: playground-preview-lifecycle
        spec:
          serviceAccountName: playground-preview-lifecycle
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
{{ toYaml .Values.nodeSelector | indent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: lifecycle
              image: {{ .Values.image | quote }}
              imagePullPolicy: IfNotPresent
              command: ["python3", "/scripts/lifecycle.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: GITOPS_REPOSITORY
                  value: {{ .Values.repository | quote }}
                - name: GITOPS_BRANCH
                  value: {{ .Values.branch | quote }}
                - name: GITHUB_APP_ID_FILE
                  value: /github-app/app_id
                - name: GITHUB_APP_KEY_FILE
                  value: /github-app/private_key
              resources:
{{ toYaml .Values.resources | indent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: github-app
                  mountPath: /github-app
                  readOnly: true
                - name: kubernetes-token
                  mountPath: /kubernetes
                  readOnly: true
                - name: vault-token
                  mountPath: /vault
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: playground-preview-lifecycle
            - name: github-app
              secret:
                secretName: playground-preview-github-app
                defaultMode: 0440
            - name: kubernetes-token
              projected:
                defaultMode: 0440
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 600
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
            - name: vault-token
              projected:
                defaultMode: 0440
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: vault
                      expirationSeconds: 600
