# Argo CD intentionally preserves CRDs during Application cascading deletion.
# This one-off GitOps hook removes only the verified, now-unused updater CRD.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-playground-webhook-crd-cleanup
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-playground-webhook-crd-cleanup
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [imageupdaters.argocd-image-updater.argoproj.io]
    verbs: [get, delete]
  - apiGroups: [argocd-image-updater.argoproj.io]
    resources: [imageupdaters]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-playground-webhook-crd-cleanup
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-playground-webhook-crd-cleanup
subjects:
  - kind: ServiceAccount
    name: harbor-playground-webhook-crd-cleanup
    namespace: harbor
---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-playground-webhook-crd-cleanup
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-playground-webhook-crd-cleanup
    spec:
      serviceAccountName: harbor-playground-webhook-crd-cleanup
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cleanup
          image: {{ .Values.image }}
          command: [python, -B, -c]
          args:
            - |
              import json
              from pathlib import Path
              import ssl
              import time
              import urllib.error
              import urllib.request

              BASE = "https://kubernetes.default.svc"
              NAME = "imageupdaters.argocd-image-updater.argoproj.io"
              CRD = "/apis/apiextensions.k8s.io/v1/customresourcedefinitions/" + NAME
              INSTANCES = "/apis/argocd-image-updater.argoproj.io/v1alpha1/imageupdaters"
              EXPECTED_UID = "90937087-827c-4c27-9191-236452bb892a"
              SERVICE_ACCOUNT = Path("/var/run/secrets/kubernetes.io/serviceaccount")

              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None

              opener = urllib.request.build_opener(
                  urllib.request.HTTPSHandler(context=ssl.create_default_context(
                      cafile=str(SERVICE_ACCOUNT / "ca.crt"))), NoRedirect())

              def request(method, path, payload=None):
                  if (method, path) not in {("GET", CRD), ("GET", INSTANCES), ("DELETE", CRD)}:
                      raise ValueError("Out-of-scope cleanup request")
                  req = urllib.request.Request(
                      BASE + path, method=method,
                      data=None if payload is None else json.dumps(payload).encode(),
                      headers={"Authorization": "Bearer " + (SERVICE_ACCOUNT / "token").read_text().strip(),
                               "Content-Type": "application/json", "Accept": "application/json"})
                  try:
                      with opener.open(req, timeout=10) as response:
                          body = response.read()
                          return json.loads(body) if body else None
                  except urllib.error.HTTPError as error:
                      if error.code == 404 and path == CRD:
                          return None
                      raise

              def cleanup():
                  crd = request("GET", CRD)
                  if crd is None:
                      return
                  metadata = crd.get("metadata", {})
                  if (metadata.get("name") != NAME
                          or metadata.get("uid") != EXPECTED_UID
                          or not metadata.get("resourceVersion")
                          or crd.get("spec", {}).get("group") != "argocd-image-updater.argoproj.io"):
                      raise ValueError("Unexpected CRD ownership; refusing deletion")
                  instances = request("GET", INSTANCES)
                  if (not isinstance(instances, dict)
                          or not isinstance(instances.get("items"), list)
                          or instances["items"]
                          or instances.get("metadata", {}).get("continue")):
                      raise ValueError("CRD has instances or an incomplete inventory; refusing deletion")
                  request("DELETE", CRD, {
                      "apiVersion": "v1", "kind": "DeleteOptions",
                      "preconditions": {"uid": EXPECTED_UID,
                                        "resourceVersion": metadata["resourceVersion"]}})
                  for attempt in range(30):
                      if request("GET", CRD) is None:
                          return
                      time.sleep(3)
                  raise ValueError("Retired CRD still exists")

              try:
                  cleanup()
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"CRD cleanup failed: HTTP {error.code}") from None
              except Exception as error:
                  raise SystemExit(f"CRD cleanup failed: {type(error).__name__}") from None
              print("Retired Image Updater CRD absent; no custom resources deleted", flush=True)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
