apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-playground-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: harbor-playground-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: harbor-playground-webhook
    serviceAccount: harbor-playground-webhook
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: harbor-playground-webhook-api
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: harbor-playground-webhook
  mount: kv
  type: kv-v2
  path: {{ .Values.apiCredentialsVaultPath }}
  refreshAfter: 1m
  destination:
    create: true
    name: harbor-playground-webhook-api
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        username:
          text: '{{ `{{ get .Secrets "username" }}` }}'
        password:
          text: '{{ `{{ get .Secrets "password" }}` }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: harbor-playground-webhook-token
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: harbor-playground-webhook
  mount: kv
  type: kv-v2
  path: ci/playground-image-updater-webhook
  refreshAfter: 1m
  destination:
    create: true
    name: harbor-playground-webhook-token
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        secret:
          text: '{{ `{{ get .Secrets "secret" }}` }}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-playground-webhook-configure
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  policy.json: |
    {{ .Values.policy | toJson }}
  configure.py: |
{{ .Files.Get "files/configure.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-playground-webhook-configure
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-playground-webhook-configure
    spec:
      serviceAccountName: harbor-playground-webhook
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: configure
          image: {{ .Values.image }}
          command: [python, -B, /config/configure.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: api, mountPath: /credentials, readOnly: true}
            - {name: token, mountPath: /webhook, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: harbor-playground-webhook-configure
        - name: api
          secret:
            secretName: harbor-playground-webhook-api
        - name: token
          secret:
            secretName: harbor-playground-webhook-token
