route:
  hostname: harbor.internal.api-api-api.com

harbor:
  expose:
    type: clusterIP
    tls:
      enabled: false

  externalURL: https://harbor.internal.api-api-api.com

  existingSecretAdminPassword: harbor-credentials
  existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
  existingSecretSecretKey: harbor-credentials

  updateStrategy:
    type: Recreate

  persistence:
    enabled: true
    resourcePolicy: keep
    persistentVolumeClaim:
      registry:
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 5Gi
      redis:
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi

  trivy:
    enabled: false

  metrics:
    enabled: false

  nginx:
    livenessProbe:
      initialDelaySeconds: 300
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  portal:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

  core:
    existingSecret: harbor-credentials
    existingXsrfSecret: harbor-credentials
    existingXsrfSecretKey: CSRF_KEY
    secretName: harbor-token
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  jobservice:
    existingSecret: harbor-credentials
    existingSecretKey: JOBSERVICE_SECRET
    jobLoggers:
      - stdout
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  registry:
    existingSecret: harbor-credentials
    existingSecretKey: REGISTRY_HTTP_SECRET
    credentials:
      existingSecret: harbor-credentials
    registry:
      livenessProbe:
        initialDelaySeconds: 300
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 12
        successThreshold: 1
      readinessProbe:
        initialDelaySeconds: 1
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 12
        successThreshold: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
    controller:
      livenessProbe:
        initialDelaySeconds: 300
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 12
        successThreshold: 1
      readinessProbe:
        initialDelaySeconds: 1
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 12
        successThreshold: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi

  database:
    type: external
    external:
      host: postgres-rw.harbor.svc.cluster.local
      port: "5432"
      username: harbor
      coreDatabase: registry
      existingSecret: harbor-database-app
      sslmode: require

  redis:
    type: internal
    internal:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
