apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: mailu
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mailu
    serviceAccount: vault-secrets
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mailu-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: mailu
  mount: kv
  type: kv-v2
  path: mailu/config
  refreshAfter: 1m
  destination:
    create: true
    name: mailu-credentials
    transformation:
      excludeRaw: true
