apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: mailu-redis
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.10.1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
