apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailu
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailu-front
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: front, app.kubernetes.io/instance: mailu}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: keycloak}
      ports:
        - {port: 465, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {port: 80, protocol: TCP}
