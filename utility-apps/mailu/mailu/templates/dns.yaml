apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: mailu-public
spec:
  endpoints:
    - dnsName: mail.api-api-api.com
      recordType: A
      recordTTL: 300
      targets: [213.231.50.44]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
    - dnsName: api-api-api.com
      recordType: TXT
      recordTTL: 300
      targets: ['"v=spf1 a:mail.api-api-api.com ~all"']
    - dnsName: dkim._domainkey.api-api-api.com
      recordType: TXT
      recordTTL: 300
      targets:
        - '"v=DKIM1; k=rsa; "'
    - dnsName: _dmarc.api-api-api.com
      recordType: TXT
      recordTTL: 300
      targets: ['"v=DMARC1; p=none"']
