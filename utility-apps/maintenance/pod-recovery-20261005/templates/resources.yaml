{{- $root := . -}}
{{- $targets := .Files.Get "files/targets.json" | fromJsonArray -}}
{{- $namespaces := dict -}}
{{- range $target := $targets -}}
{{- $_ := set $namespaces $target.namespace true -}}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-recovery-20261005
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-recovery-20261005
data:
  recover.py: |
{{ .Files.Get "files/recover.py" | indent 4 }}
  targets.json: |
{{ .Files.Get "files/targets.json" | indent 4 }}
{{- range $namespace, $_ := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-recovery-20261005
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, delete]
    resourceNames:
{{- range $target := $targets }}
{{- if eq $target.namespace $namespace }}
      - {{ $target.name | quote }}
{{- end }}
{{- end }}
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-recovery-20261005
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-recovery-20261005
subjects:
  - kind: ServiceAccount
    name: pod-recovery-20261005
    namespace: {{ $root.Release.Namespace }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pod-recovery-20261005
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: pod-recovery-20261005
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: general-1-worker-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recovery
          image: ghcr.io/actions/actions-runner:2.337.0@sha256:5036480998280bb21e32ade9fe1b02b493861ac314b62ba1aea320b94f56ec97
          command: [python3, -B, /work/recover.py]
          resources:
            requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 8Mi}
            limits: {cpu: 200m, memory: 128Mi, ephemeral-storage: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: code, mountPath: /work, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: code
          configMap:
            name: pod-recovery-20261005
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
