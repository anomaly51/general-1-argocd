apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-mirror
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: minio-mirror
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: maintenance-minio-mirror
    serviceAccount: minio-mirror
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: minio-mirror-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: minio-mirror
  mount: kv
  type: kv-v2
  path: ci/harbor-applications
  refreshAfter: 1h
  destination:
    create: true
    name: minio-mirror-registry
    transformation:
      excludes: [".*"]
      templates:
        config.json:
          text: |
            {"auths":{"harbor.internal.api-api-api.com":{"username":"{{ `{{ get .Secrets "username" }}` }}","password":"{{ `{{ get .Secrets "password" }}` }}"}}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-mirror
data:
  export.py: |
{{ .Files.Get "files/export.py" | indent 4 }}
  publish.py: |
{{ .Files.Get "files/publish.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-mirror-v1
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: minio-mirror
      automountServiceAccountToken: false
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: general-1-worker-1
      initContainers:
        - name: export
          image: docker.io/library/debian:13-slim
          command: [/bin/sh, -ec]
          args:
            - nsenter --target 1 --mount --uts --ipc --net --pid --root --wd -- /usr/bin/python3 - < /script/export.py > /work/minio.tar
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: script, mountPath: /script, readOnly: true}
            - {name: work, mountPath: /work}
      containers:
        - name: publish
          image: docker.io/library/python:3.12-slim
          command: [python, /script/publish.py]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: script, mountPath: /script, readOnly: true}
            - {name: registry, mountPath: /registry, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: script
          configMap: {name: minio-mirror}
        - name: registry
          secret: {secretName: minio-mirror-registry}
        - name: work
          emptyDir: {sizeLimit: 512Mi}
