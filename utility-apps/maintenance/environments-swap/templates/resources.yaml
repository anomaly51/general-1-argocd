{{- range .Values.targets }}
{{- if not (regexMatch "^general-1-worker-[123]$" .hostname) }}{{ fail "target must be one explicit General1 worker" }}{{ end -}}
{{- if not (regexMatch "^[a-f0-9]{32}$" .machineId) }}{{ fail "target.machineId must be the audited host machine-id" }}{{ end -}}
{{- if ne $.Values.disk.serial "environments-swap-v1" }}{{ fail "only dedicated environments-swap-v1 disk is permitted" }}{{ end -}}
{{- if ne (int64 $.Values.disk.sizeBytes) (int64 17179869184) }}{{ fail "only the dedicated exact 16GiB disk is permitted" }}{{ end -}}
{{- if lt (int64 $.Values.rootReserveBytes) (int64 1073741824) }}{{ fail "root reserve must be at least 1GiB" }}{{ end -}}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{0,29}$" .operationId) }}{{ fail "invalid operationId" }}{{ end -}}
{{- if not (regexMatch "^docker.io/library/python:3[.]12-slim-bookworm@sha256:[a-f0-9]{64}$" $.Values.image) }}{{ fail "maintenance image must be digest pinned" }}{{ end -}}
{{- if not (has .phase (list "prepareDependencies" "activate")) }}{{ fail "phase must be prepareDependencies or activate" }}{{ end -}}
{{- if $.Values.baselineFailSwapOn }}{{ fail "rollback with retained swap requires audited baseline failSwapOn=false" }}{{ end -}}
{{- if and (not .suspended) (eq .phase "activate") (or (empty .expectedKubeletFileHashes) (not $.Values.noKubeletArgumentOverridesVerified)) }}{{ fail "activation requires audited kubelet hashes and override preflight" }}{{ end -}}
{{- $phaseName := ternary "prepare" "activate" (eq .phase "prepareDependencies") -}}

{{ printf "\n---\n" }}apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ .operationId }}
  namespace: {{ $.Release.Namespace }}
data:
  plan.json: |
    {{ dict "hostname" .hostname "machine_id" .machineId "serial" $.Values.disk.serial "size_bytes" $.Values.disk.sizeBytes "root_reserve_bytes" $.Values.rootReserveBytes "expected_kubelet_hashes" .expectedKubeletFileHashes "no_kubelet_overrides_verified" $.Values.noKubeletArgumentOverridesVerified "baseline_fail_swap_on" $.Values.baselineFailSwapOn "disk_eviction_hard" $.Values.expectedDiskEvictionHard | toJson }}
  maintenance.py: |
{{ $.Files.Get "files/maintenance.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-{{ $phaseName }}-{{ .operationId }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
spec:
  suspend: {{ .suspended }}
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: environments-swap
        app.kubernetes.io/component: maintenance
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostPID: true
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: {{ .hostname }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: maintenance
          image: {{ $.Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -B, /plan/maintenance.py, --enter-host]
          args: [{{ .phase | quote }}]
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          volumeMounts:
            - name: host
              mountPath: /host
            - name: plan
              mountPath: /plan
              readOnly: true
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
        - name: plan
          configMap:
            name: {{ $.Release.Name }}-{{ .operationId }}
{{- end }}
