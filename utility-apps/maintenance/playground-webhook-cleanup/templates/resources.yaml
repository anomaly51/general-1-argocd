apiVersion: v1
kind: ServiceAccount
metadata:
  name: playground-webhook-cleanup
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: playground-webhook-cleanup
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [playground-image-updater-webhook-tls]
    verbs: [get, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    resourceNames: [playground-image-updater-webhook]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [playground-image-updater-controller]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: playground-webhook-cleanup
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: playground-webhook-cleanup
subjects:
  - kind: ServiceAccount
    name: playground-webhook-cleanup
    namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: playground-webhook-cleanup
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    spec:
      serviceAccountName: playground-webhook-cleanup
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      containers:
        - name: cleanup
          image: docker.io/library/python:3.12-slim-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          command: [python, -B, -c]
          args:
            - |
              import json, ssl, urllib.error, urllib.request
              from pathlib import Path
              SECRET = "playground-image-updater-webhook-tls"
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      return None
              def main():
                  sa = Path("/var/run/secrets/kubernetes.io/serviceaccount")
                  token = (sa / "token").read_text().strip()
                  opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPSHandler(
                      context=ssl.create_default_context(cafile=str(sa / "ca.crt"))))
                  def request(method, path, body=None, metadata=False):
                      headers = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}
                      if metadata:
                          headers["Accept"] = "application/json;as=PartialObjectMetadata;g=meta.k8s.io;v=v1"
                      req = urllib.request.Request("https://kubernetes.default.svc" + path,
                          method=method, headers=headers, data=None if body is None else json.dumps(body).encode())
                      try:
                          with opener.open(req, timeout=10) as response:
                              return json.load(response)
                      except urllib.error.HTTPError as error:
                          if error.code == 404:
                              return None
                          raise RuntimeError(f"Kubernetes {method} failed: HTTP {error.code}") from None
                  certificate = request("GET", "/apis/cert-manager.io/v1/namespaces/argocd/certificates/playground-image-updater-webhook", metadata=True)
                  if certificate is not None:
                      raise RuntimeError("Retired Certificate still exists; refusing cleanup")
                  deployment = request("GET", "/apis/apps/v1/namespaces/argocd/deployments/playground-image-updater-controller")
                  if not deployment or SECRET in json.dumps(deployment["spec"]["template"]):
                      raise RuntimeError("Updater missing or still references retired Secret")
                  status, desired = deployment.get("status", {}), deployment["spec"].get("replicas", 1)
                  if (desired < 1 or status.get("observedGeneration", 0) < deployment["metadata"]["generation"]
                          or any(status.get(key, 0) != desired for key in ("replicas", "updatedReplicas", "readyReplicas", "availableReplicas"))):
                      raise RuntimeError("Replacement updater is not fully ready")
                  path = "/api/v1/namespaces/argocd/secrets/" + SECRET
                  secret = request("GET", path, metadata=True)
                  if secret is None:
                      print("Retired webhook TLS Secret already absent", flush=True)
                      return
                  request("DELETE", path, {"apiVersion": "v1", "kind": "DeleteOptions",
                      "preconditions": {"uid": secret["metadata"]["uid"]}})
                  print("Retired webhook TLS Secret cleanup completed", flush=True)
              try:
                  main()
              except Exception as error:
                  reason = str(error) if isinstance(error, RuntimeError) else type(error).__name__
                  raise SystemExit(f"Cleanup failed: {reason}") from None
