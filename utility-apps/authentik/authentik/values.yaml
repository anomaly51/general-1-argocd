authentik:
  authentik:
    existingSecret:
      secretName: authentik

  server:
    replicas: 1
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

  worker:
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: general-1-worker-1
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

  postgresql:
    enabled: false
