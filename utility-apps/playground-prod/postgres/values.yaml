name: playground-postgres
image: ghcr.io/cloudnative-pg/postgresql:17.6-standard-bookworm
database: playground
owner: playground
storage:
  className: local-path
  # Local-path capacity was verified on worker 3; changing this needs data migration.
  nodeName: general-1-worker-3
  size: 5Gi
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 768Mi}
