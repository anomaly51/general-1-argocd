apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    strimzi.io/cluster: {{ .Values.name }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 1
  roles: [controller, broker]
  jvmOptions:
    -Xms: 512m
    -Xmx: 1g
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  storage:
    type: persistent-claim
    size: {{ .Values.storage.size }}
    class: {{ .Values.storage.className }}
    deleteClaim: false
  template:
    persistentVolumeClaim:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.name }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  kafka:
    version: {{ .Values.version | quote }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
    config:
      auto.create.topics.enable: false
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      num.partitions: 3
      log.retention.hours: 24
      log.segment.bytes: 134217728
  entityOperator:
    topicOperator:
      watchedNamespace: {{ .Release.Namespace }}
      jvmOptions:
        -Xms: 128m
        -Xmx: 256m
      resources:
        {{- toYaml .Values.topicOperatorResources | nindent 8 }}
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name | replace "." "-" }}
  labels:
    strimzi.io/cluster: {{ $.Values.name }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  topicName: {{ .name }}
  partitions: {{ .partitions }}
  replicas: 1
  config:
    retention.ms: {{ .retentionMs | int64 }}
    min.insync.replicas: 1
{{- end }}
