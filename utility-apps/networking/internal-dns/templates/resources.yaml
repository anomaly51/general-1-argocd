apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-dns
data:
  Corefile: |
    internal.api-api-api.com:53 {
        errors
        file /etc/coredns/internal.db
        cache 30
    }

    .:53 {
        errors
        health :8080
        ready :8181
        forward . 1.1.1.1 8.8.8.8
        cache 300
        reload
    }
  internal.db: |
    $ORIGIN internal.api-api-api.com.
    $TTL 30
    @  IN SOA ns.internal.api-api-api.com. hostmaster.api-api-api.com. (
           1 3600 600 604800 30
       )
       IN NS ns.internal.api-api-api.com.
    ns IN A 192.168.1.104
    *  IN A 192.168.1.104
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-dns
    spec:
      automountServiceAccountToken: false
      dnsPolicy: Default
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.2
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
          readinessProbe:
            httpGet:
              path: /ready
              port: ready
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: internal-dns
---
apiVersion: v1
kind: Service
metadata:
  name: internal-dns
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: internal-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
