apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-dns
data:
  Corefile: |
    internal.api-api-api.com:53 {
        errors
        file /etc/coredns/internal.db
        cache 30
    }

    .:53 {
        errors
        health :8080 {
          lameduck 5s
        }
        ready :8181
        forward . 1.1.1.1 8.8.8.8 {
          policy sequential
          health_check 2s
          max_fails 2
          expire 30s
          max_concurrent 1000
        }
        cache 300
        reload
    }
  internal.db: |
    $ORIGIN internal.api-api-api.com.
    $TTL 30
    @  IN SOA ns.internal.api-api-api.com. hostmaster.api-api-api.com. (
           2026080701 3600 600 604800 30
       )
       IN NS ns.internal.api-api-api.com.
    ns IN A 192.168.1.2
    *  IN A 192.168.1.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-dns
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-dns
    spec:
      automountServiceAccountToken: false
      dnsPolicy: Default
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: internal-dns
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.2
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: ready
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: internal-dns
---
apiVersion: v1
kind: Service
metadata:
  name: internal-dns
  annotations:
    metallb.io/address-pool: lan
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.2
  selector:
    app.kubernetes.io/name: internal-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: internal-dns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-dns
