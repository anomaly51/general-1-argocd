external-dns:
  provider:
    name: cloudflare
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: api-token
  sources:
    - gateway-httproute
    - crd
  domainFilters:
    - api-api-api.com
  managedRecordTypes: [A, AAAA, CNAME, TXT]
  policy: sync
  registry: txt
  txtOwnerId: general-1-k3s
  txtPrefix: "%{record_type}."
  interval: 1m
  extraArgs:
    - --cloudflare-proxied
    - --gateway-name=public
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
