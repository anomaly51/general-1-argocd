apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-resolver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-resolver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-resolver
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers: [192.168.1.2]
      tolerations:
        - operator: Exists
      containers:
        - name: resolver
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              while true; do
                for file in /host/resolv.conf.head /host/resolv.conf; do
                  if ! grep -qE '^[[:space:]]*nameserver[[:space:]]+' "$file"; then
                    printf '\nnameserver 192.168.1.2\n' >> "$file"
                    echo "Restored LAN DNS in $file"
                  fi
                done
                sleep 30
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
          volumeMounts:
            - name: resolver
              mountPath: /host/resolv.conf
            - name: resolver-head
              mountPath: /host/resolv.conf.head
      volumes:
        - name: resolver
          hostPath:
            path: /etc/resolv.conf
            type: File
        - name: resolver-head
          hostPath:
            path: /etc/resolv.conf.head
            type: FileOrCreate
