apiVersion: v1
kind: Service
metadata:
  name: marstek
spec:
  selector:
    app.kubernetes.io/name: marstek-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marstek-proxy
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      server {
        listen 8080;
        location / {
          limit_except GET { deny all; }
          proxy_pass http://{{ .Values.upstream.address }}:{{ .Values.upstream.port }};
          proxy_connect_timeout 3s;
          proxy_read_timeout 10s;
          proxy_set_header Host $host;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marstek-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: marstek-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marstek-proxy
      annotations:
        upstream: {{ printf "%s:%v" .Values.upstream.address .Values.upstream.port | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: {{ .Values.image | quote }}
          command: [nginx, -c, /etc/marstek/nginx.conf, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/marstek
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: marstek-proxy
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: marstek
spec:
  parentRefs:
    - name: public
      namespace: networking
      sectionName: https
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        {{- range list "/" "/index.html" "/app.js" "/style.css" "/api/status" "/health" }}
        - method: GET
          path:
            type: Exact
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: marstek
          port: 80
