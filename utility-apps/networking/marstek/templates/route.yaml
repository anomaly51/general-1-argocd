apiVersion: v1
kind: Service
metadata:
  name: marstek
spec:
  selector:
    app.kubernetes.io/name: marstek-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marstek-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: marstek-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marstek-proxy
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        upstream: {{ printf "%s:%v" .Values.upstream.address .Values.upstream.port | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: {{ .Values.image | quote }}
          command: [nginx, -c, /etc/marstek/nginx.conf, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/marstek
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: marstek-proxy
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: marstek
spec:
  parentRefs:
    - name: public
      namespace: networking
      sectionName: https
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        {{- range list "/" "/index.html" "/app.js" "/style.css" "/api/status" "/api/events" "/api/auth" "/health" }}
        - method: GET
          path:
            type: Exact
            value: {{ . | quote }}
        {{- end }}
        - method: GET
          path:
            type: PathPrefix
            value: /assets/
        {{- range list "/api/login" "/api/logout" }}
        - method: POST
          path:
            type: Exact
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: marstek
          port: 80
