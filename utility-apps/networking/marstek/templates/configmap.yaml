apiVersion: v1
kind: ConfigMap
metadata:
  name: marstek-proxy
data:
  frontend-headers.conf: |
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      server {
        listen 8080;
        root /srv/marstek;
        location = / {
          rewrite ^ /index.html last;
        }
        location = /index.html {
          limit_except GET { deny all; }
          charset utf-8;
          include /etc/marstek/frontend-headers.conf;
          try_files $uri =404;
        }
        location = /assets/energy-v1.webmanifest {
          limit_except GET { deny all; }
          types { application/manifest+json webmanifest; }
          include /etc/marstek/frontend-headers.conf;
          try_files $uri =404;
        }
        location /assets/ {
          limit_except GET { deny all; }
          include /etc/marstek/frontend-headers.conf;
          try_files $uri =404;
        }
        location = /api/events {
          limit_except GET { deny all; }
          proxy_pass http://{{ .Values.upstream.address }}:{{ .Values.upstream.port }};
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 45s;
          proxy_connect_timeout 3s;
          proxy_set_header Host $host;
        }
        location / {
          limit_except GET POST { deny all; }
          proxy_pass http://{{ .Values.upstream.address }}:{{ .Values.upstream.port }};
          proxy_connect_timeout 3s;
          proxy_read_timeout 20s;
          client_max_body_size 4k;
          proxy_set_header Host $host;
        }
      }
    }
