apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
data:
  config.yaml: |
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: "*.internal.api-api-api.com"
        service: http_status:404
      - hostname: "*.api-api-api.com"
        service: {{ .Values.origin }}
        originRequest:
          noTLSVerify: true
      - service: http_status:404
