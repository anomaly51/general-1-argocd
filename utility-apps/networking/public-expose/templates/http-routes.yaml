{{- range .Values.routes }}
{{- if not (hasSuffix (printf ".%s" $.Values.domain) .hostname) }}
{{- fail (printf "hostname %s is outside managed domain %s" .hostname $.Values.domain) }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ .hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .service.name }}
          port: {{ .service.port }}
{{- end }}
