apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.tlsSecretName }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  secretName: {{ .Values.gateway.tlsSecretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.issuer }}
  dnsNames:
    - {{ printf "*.%s" .Values.domain | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ .Values.tunnelTarget }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: https
      hostname: {{ printf "*.%s" .Values.domain | quote }}
      protocol: HTTPS
      port: {{ .Values.gateway.listenerPort }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
