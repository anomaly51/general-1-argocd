domain: api-api-api.com
tunnelTarget: 4a29ced3-c1b8-4e6f-885b-8b2caaec2149.cfargotunnel.com
issuer: letsencrypt-production

routes:
  - name: argocd
    namespace: argocd
    hostname: argocd.api-api-api.com
    service:
      name: argocd-server
      port: 443
      scheme: https
      insecureSkipVerify: true
  - name: grafana
    namespace: monitoring
    hostname: grafana.api-api-api.com
    service:
      name: grafana
      port: 80
      scheme: http
  - name: nginx
    namespace: apps
    hostname: nginx.api-api-api.com
    service:
      name: nginx
      port: 80
      scheme: http
