apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-buildkit
  annotations:
    # Temporary guard while ownership moves to the shared runner application.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  buildkitd.toml: |
    [worker.oci]
      enabled = true
      max-parallelism = {{ .Values.buildkit.maxParallelism }}
      gc = true
      reservedSpace = {{ .Values.buildkit.reservedSpace | quote }}
      maxUsedSpace = {{ .Values.buildkit.maxUsedSpace | quote }}
      minFreeSpace = {{ .Values.buildkit.minFreeSpace | quote }}
    [[worker.oci.gcpolicy]]
      all = true
      reservedSpace = {{ .Values.buildkit.reservedSpace | quote }}
      maxUsedSpace = {{ .Values.buildkit.maxUsedSpace | quote }}
      minFreeSpace = {{ .Values.buildkit.minFreeSpace | quote }}
    [worker.containerd]
      enabled = false
