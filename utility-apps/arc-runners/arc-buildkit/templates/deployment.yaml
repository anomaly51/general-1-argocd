apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-buildkit
  annotations:
    # Temporary guard while ownership moves to the shared runner application.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-buildkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-buildkit
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: buildkitd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --addr
            - tcp://0.0.0.0:{{ .Values.service.port }}
            - --config
            - /etc/buildkit/buildkitd.toml
          securityContext:
            privileged: true
          ports:
            - name: buildkit
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            tcpSocket:
              port: buildkit
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: buildkit
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /var/lib/buildkit
            - name: config
              mountPath: /etc/buildkit
              readOnly: true
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: arc-buildkit-cache
        - name: config
          configMap:
            name: arc-buildkit
