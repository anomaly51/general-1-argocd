apiVersion: v1
kind: Service
metadata:
  name: arc-buildkit
  annotations:
    # Temporary guard while ownership moves to the shared runner application.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arc-buildkit
  ports:
    - name: buildkit
      port: {{ .Values.service.port }}
      targetPort: buildkit
